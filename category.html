<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>SpotTribe Bali — Category Directory</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding-bottom: 70px; }
    .glass-nav-dark { background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
</head>
<body class="flex flex-col text-slate-800">

  <!-- HEADER -->
  <header class="glass-nav-dark border-b border-slate-800 px-6 h-[72px] flex items-center justify-between sticky top-0 z-50 shadow-lg">
    <div class="flex items-center gap-3.5">
      <a href="./index.html" class="w-10 h-10 rounded-xl bg-slate-800 text-white flex items-center justify-center hover:bg-slate-700 transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 id="categoryTitle" class="font-extrabold text-sm tracking-tight text-white uppercase">Category Directory</h1>
        <p class="text-[10px] text-slate-400 font-medium tracking-wide">SpotTribe Bali Curated Results</p>
      </div>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <main class="max-w-4xl mx-auto px-6 py-8 w-full">
    <div id="loadingState" class="text-center py-20 text-slate-400 font-medium">
      Loading curated spots...
    </div>

    <!-- Grid Kartu Vertikal dengan Google Maps Iframe -->
    <div id="spotsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <!-- Hasil query Supabase akan dirender di sini secara dinamis -->
    </div>
  </main>

  <!-- SUPABASE FETCH SCRIPT -->
  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryType = urlParams.get('type');
    const searchQuery = urlParams.get('q');

    // Function untuk memecah teks kolom 'amenity' dari database menjadi badge rapi
    function renderAmenitiesBadges(amenityString) {
      if (!amenityString || typeof amenityString !== 'string') {
        return `
          <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-600 text-[11px] font-medium px-2.5 py-1 rounded-lg">
            📍 Scenic Area
          </span>
          <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-600 text-[11px] font-medium px-2.5 py-1 rounded-lg">
            📸 Photo Spot
          </span>
        `;
      }

      // Pecah berdasarkan pemisah titik (•) atau koma (,)
      const items = amenityString.split(/[•,]/).map(i => i.trim()).filter(Boolean);

      return items.map(item => `
        <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 text-[11px] font-medium px-2.5 py-1 rounded-lg border border-slate-200/60">
          <span>✨</span>
          <span>${escapeHtml(item)}</span>
        </span>
      `).join('');
    }

    async function loadCategorySpots() {
      const container = document.getElementById('spotsContainer');
      const titleEl = document.getElementById('categoryTitle');
      const loadingEl = document.getElementById('loadingState');

      if (categoryType) {
        titleEl.innerText = `${categoryType} Spots`;
      } else if (searchQuery) {
        titleEl.innerText = `Search: "${searchQuery}"`;
      }

      try {
        let queryBuilder = clientSupabase.from('places').select('*');

        if (categoryType) {
          queryBuilder = queryBuilder.eq('category', categoryType);
        } else if (searchQuery) {
          queryBuilder = queryBuilder.ilike('name', `%${searchQuery}%`);
        }

        const { data: places, error } = await queryBuilder;

        if (error) throw error;

        loadingEl.style.display = 'none';

        if (!places || places.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-200">
              <p class="text-slate-500 font-semibold text-sm">No spots found in this category yet.</p>
              <a href="./index.html" class="inline-block mt-3 text-xs font-bold text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl">Back to Explore</a>
            </div>
          `;
          return;
        }

        container.innerHTML = places.map(spot => {
          // Prioritaskan map_url dari database, jika kosong gunakan fallback pencarian nama otomatis
          let mapEmbedUrl = spot.map_url;
          if (!mapEmbedUrl) {
            const locationQuery = encodeURIComponent(`${spot.name}, ${spot.area || spot.regency || 'Bali'}`);
            mapEmbedUrl = `https://maps.google.com/maps?q=${locationQuery}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
          }

          return `
            <div class="bg-white rounded-3xl border border-slate-200/90 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
              
              <!-- GOOGLE MAPS IFRAME (Menggantikan Foto Utama) -->
              <div class="relative w-full h-44 bg-slate-100">
                <iframe 
                  src="${mapEmbedUrl}" 
                  width="100%" 
                  height="100%" 
                  style="border:0;" 
                  allowfullscreen="" 
                  loading="lazy" 
                  referrerpolicy="no-referrer-when-downgrade"
                  class="w-full h-full object-cover">
                </iframe>
                <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-black text-emerald-600 shadow-xs pointer-events-none">
                  ★ ${spot.rating || '4.5'}
                </div>
              </div>

              <!-- KONTEN -->
              <div class="p-5 flex flex-col gap-3 flex-grow justify-between">
                <div>
                  <h3 class="font-extrabold text-slate-900 text-base leading-snug">${escapeHtml(spot.name)}</h3>
                  <p class="text-xs text-slate-500 font-medium flex items-center gap-1 mt-1">
                    <span class="text-rose-500">📍</span> ${escapeHtml(spot.area || spot.regency || 'Bali')}
                  </p>
                </div>

                <!-- AMENITIES DARI KOLOM DATABASE -->
                <div class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-100">
                  ${renderAmenitiesBadges(spot.amenity)}
                </div>

                <!-- BOTTOM RATES -->
                <div class="flex items-center justify-between pt-3 border-t border-slate-100 text-xs">
                  <span class="text-slate-400 font-medium">Rates / Status</span>
                  <span class="font-bold text-slate-900 bg-slate-100 px-3 py-1 rounded-xl">
                    ${escapeHtml(spot.price_label || spot.price || 'Contact for Rates')}
                  </span>
                </div>
              </div>

            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loading category spots:', err);
        loadingEl.innerText = 'Failed to load data. Please check your connection.';
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadCategorySpots();
    lucide.createIcons();
  </script>
</body>
</html>
