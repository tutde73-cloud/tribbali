<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali - Explore Spots</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- 1. CDN Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-24">

  <!-- TOP HEADER BAR -->
  <header class="h-16 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div>
        <h1 id="categoryTitle" class="font-bold text-base text-slate-100 capitalize leading-tight">Exploring Spots</h1>
        <p id="spotCount" class="text-[11px] text-slate-400">Connecting to Supabase...</p>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 p-4 max-w-xl mx-auto w-full">

    <!-- UI TOMBOL FILTER SORTIR -->
    <div id="filterSection" class="flex items-center gap-2 mb-4 hidden">
      <span class="text-xs text-slate-400 font-medium mr-1">Sort by:</span>
      <button onclick="sortPlaces('rating')" id="sortRatingBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1">
        ⭐ Highest Rating
      </button>
      <button onclick="sortPlaces('price')" id="sortPriceBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1">
        💰 Lowest Price
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400 gap-3">
      <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs font-medium">Fetching real-time data from Supabase...</p>
    </div>

    <!-- Spots Card Grid -->
    <div id="spotsList" class="flex flex-col gap-4 hidden"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 px-4">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 text-slate-400 flex items-center justify-center mx-auto mb-3 border border-slate-800">
        <i data-lucide="map-pin-off" class="w-6 h-6"></i>
      </div>
      <h3 class="text-sm font-semibold text-slate-200 mb-1">No spots found</h3>
      <p class="text-xs text-slate-400 max-w-xs mx-auto mb-4">No listings available in Supabase for this category right now.</p>
      <button onclick="loadPlacesFromSupabase(categoryType)" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold hover:bg-emerald-700 transition-colors">
        Try Again
      </button>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex items-center justify-around px-4 z-30">
    <a href="index.html" class="flex flex-col items-center gap-1 text-emerald-400">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Explore</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Chats</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
  </nav>

  <!-- HUBUNGKAN DATABASE LOKAL (Untuk Judul Kategori) -->
  <script src="database.js"></script>

  <!-- SUPABASE & SORTING LOGIC -->
  <script>
    // 1. Inisialisasi Supabase Client dengan Kredensial Resmi Anda
    const SUPABASE_URL = 'https://riyupzmlltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryType = urlParams.get('type') || 'cafe';
    const searchQuery = urlParams.get('q') || urlParams.get('search');

    const socialCategories = ['meetups', 'surfing-buddies'];
    const isSocialCategory = socialCategories.includes(categoryType);

    let currentPlaces = [];
    let activeSort = null;

    // 2. Fungsi Ambil Data Dinamis dari Supabase
    async function loadPlacesFromSupabase(type) {
      const titleEl = document.getElementById('categoryTitle');
      const countEl = document.getElementById('spotCount');
      const loadingEl = document.getElementById('loading');
      const spotsListEl = document.getElementById('spotsList');
      const emptyStateEl = document.getElementById('emptyState');
      const filterSection = document.getElementById('filterSection');

      loadingEl.classList.remove('hidden');
      spotsListEl.classList.add('hidden');
      emptyStateEl.classList.add('hidden');
      filterSection.classList.add('hidden');

      if (searchQuery) {
        titleEl.innerText = `Search: "${searchQuery}"`;
      } else {
        titleEl.innerText = (typeof categoryNames !== 'undefined' && categoryNames[type]) ? categoryNames[type] : 'Bali Spots';
      }

      try {
        // Query ke tabel 'places' di Supabase dengan filter kategori
        let query = supabase.from('places').select('*');

        if (searchQuery) {
          query = query.ilike('name', `%${searchQuery}%`);
        } else {
          query = query.eq('category', type);
        }

        let { data: places, error } = await query;

        if (error) {
          console.error('Error fetching from Supabase:', error);
          throw error;
        }

        currentPlaces = places || [];
        loadingEl.classList.add('hidden');

        if (currentPlaces.length > 0) {
          filterSection.classList.remove('hidden');
          renderPlaces(currentPlaces);
          spotsListEl.classList.remove('hidden');
        } else {
          emptyStateEl.classList.remove('hidden');
        }

      } catch (err) {
        console.error('Connection or Query Failed:', err);
        loadingEl.classList.add('hidden');
        emptyStateEl.classList.remove('hidden');
      }
    }

    // 3. Fungsi Sortir Berdasarkan Rating & Harga dari Data Supabase
    function sortPlaces(criteria) {
      const ratingBtn = document.getElementById('sortRatingBtn');
      const priceBtn = document.getElementById('sortPriceBtn');

      if (activeSort === criteria) {
        activeSort = null;
        ratingBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1";
        priceBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1";
        renderPlaces(currentPlaces);
        return;
      }

      activeSort = criteria;

      if (criteria === 'rating') {
        currentPlaces.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        ratingBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950 border border-emerald-400 shadow-sm transition-all flex items-center gap-1";
        priceBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1";
      } else if (criteria === 'price') {
        currentPlaces.sort((a, b) => (a.price || 0) - (b.price || 0));
        ratingBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:border-emerald-500/50 transition-all flex items-center gap-1";
        priceBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950 border border-emerald-400 shadow-sm transition-all flex items-center gap-1";
      }

      renderPlaces(currentPlaces);
    }

    // Render HTML Card dari Hasil Supabase
    function renderPlaces(places) {
      const spotsListEl = document.getElementById('spotsList');
      const countEl = document.getElementById('spotCount');
      
      countEl.innerText = `${places.length} listings found`;

      spotsListEl.innerHTML = places.map(spot => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col sm:flex-row hover:border-slate-700 transition-all group">
          
          <!-- Foto Tempat -->
          <div class="sm:w-36 h-40 sm:h-auto relative shrink-0 overflow-hidden bg-slate-800">
            <img src="${spot.image_url || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80'}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute top-2.5 left-2.5 bg-slate-950/80 backdrop-blur text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 border border-slate-800">
              ★ ${spot.rating || '4.5'}
            </div>
          </div>

          <!-- Detail Informasi -->
          <div class="p-4 flex-1 flex flex-col justify-between gap-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h3 class="font-bold text-sm text-slate-100 leading-snug">${escapeHtml(spot.name)}</h3>
                <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400 inline"></i>
                  ${escapeHtml(spot.area || 'Bali')}
                </p>
                <p class="text-[11px] text-slate-300 font-medium mt-2 bg-slate-950/50 px-2 py-1 rounded-lg border border-slate-800/80 inline-block">
                  ${escapeHtml(spot.amenity || 'Verified Spot')}
                </p>
              </div>
            </div>

            <!-- Harga -->
            <div class="flex items-center justify-between pt-2.5 border-t border-slate-800/80">
              <span class="text-xs text-slate-400 font-medium">Starting from</span>
              <span class="text-xs font-bold text-emerald-400 font-mono">${escapeHtml(spot.price_label || '$100 / mo')}</span>
            </div>
          </div>

        </div>
      `).join('');

      lucide.createIcons();
    }

    function escapeHtml(text) {
      return text ? text.toString().replace(/"/g, '&quot;') : '';
    }

    // Eksekusi pemanggilan data Supabase saat halaman dimuat
    loadPlacesFromSupabase(categoryType);
    lucide.createIcons();
  </script>
</body>
</html>
