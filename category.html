<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali - Explore Spots</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-24">

  <!-- TOP HEADER BAR -->
  <header class="h-16 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div>
        <h1 id="categoryTitle" class="font-bold text-base text-slate-100 capitalize leading-tight">Exploring Spots</h1>
        <p id="spotCount" class="text-[11px] text-slate-400">Loading curated listings...</p>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 p-4 max-w-xl mx-auto w-full">

    <!-- Loading State -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400 gap-3">
      <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs font-medium">Curating top spots in Bali...</p>
    </div>

    <!-- Spots Card Grid -->
    <div id="spotsList" class="flex flex-col gap-4 hidden"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 px-4">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 text-slate-400 flex items-center justify-center mx-auto mb-3 border border-slate-800">
        <i data-lucide="map-pin-off" class="w-6 h-6"></i>
      </div>
      <h3 class="text-sm font-semibold text-slate-200 mb-1">No spots found</h3>
      <p class="text-xs text-slate-400 max-w-xs mx-auto mb-4">No listings available for this category right now.</p>
      <button onclick="loadCategoryData()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold hover:bg-emerald-700 transition-colors">
        Try Again
      </button>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex items-center justify-around px-4 z-30">
    <a href="index.html" class="flex flex-col items-center gap-1 text-emerald-400">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Explore</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Chats</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
  </nav>

  <!-- JAVASCRIPT LOGIC & MOCK DATA -->
  <script>
    const categoryNames = {
      'villas': 'Villas & Houses',
      'coliving': 'Coliving Hubs',
      'hotels': 'Hotels & Resorts',
      'waterfall': 'Waterfalls',
      'beach-surf': 'Beaches & Surf Spots',
      'volcano-trekking': 'Volcano & Hiking Spots',
      'wildlife': 'Wildlife & Nature',
      'rental': 'Vehicle Rentals',
      'cafe': 'Cafés & Brunch',
      'coworking': 'Coworking Spaces',
      'visa-agency': 'Visa Agencies',
      'medical': 'Medical Clinics',
      'nightclub': 'Nightclubs',
      'beach-club': 'Beach Clubs',
      'temples': 'Temples & Culture',
      'yoga-wellness': 'Yoga & Wellness',
      'meetups': 'Community Meetups',
      'surfing-buddies': 'Surf Buddies'
    };

    const urlParams = new URLSearchParams(window.location.search);
    const categoryType = urlParams.get('type') || 'cafe';
    const searchQuery = urlParams.get('q') || urlParams.get('search');

    // Identifikasi apakah kategori ini termasuk dalam Community Focus (Social)
    const socialCategories = ['meetups', 'surfing-buddies'];
    const isSocialCategory = socialCategories.includes(categoryType);

    const mockDatabase = {
      'coliving': [
        { name: "Griya Taman Gulingan", area: "Jimbaran, Bali", rating: "4.9", price: "$380 / mo", image: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=600&q=80", amenity: "📶 Wifi 200Mbps • 🏊 Pool" },
        { name: "Villa Satay", area: "Canggu, Bali", rating: "4.8", price: "$520 / mo", image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=600&q=80", amenity: "📶 Wifi 150Mbps • 🛵 Free Parking" },
        { name: "The Lemon House", area: "Pererenan, Bali", rating: "4.95", price: "$650 / mo", image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=600&q=80", amenity: "📶 Wifi 300Mbps • 🌿 Garden" }
      ],
      'meetups': [
        { name: "Canggu Nomad Sunset Gathering", area: "Echo Beach, Canggu", rating: "4.9", price: "Free Event", image: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80", amenity: "👥 45 Nomads Attending • 🍻 Drinks & Chill" },
        { name: "Ubud Startup Founders Circle", area: "Monkey Forest, Ubud", rating: "4.95", price: "Free Event", image: "https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=600&q=80", amenity: "💡 Pitching & Networking • ☕ Coffee" }
      ],
      'surfing-buddies': [
        { name: "Uluwatu Morning Surf Crew", area: "Padang Padang, Uluwatu", rating: "4.85", price: "Community", image: "https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=600&q=80", amenity: "🏄 Intermediate/Pro • 🌊 Dawn Patrol" },
        { name: "Batu Bolong Sunset Longboarders", area: "Canggu, Bali", rating: "4.8", price: "Community", image: "https://images.unsplash.com/photo-1531722569936-825d3dd91b15?auto=format&fit=crop&w=600&q=80", amenity: "🏄 All Levels • 🌴 Fun Session" }
      ]
    };

    async function loadCategoryData() {
      const titleEl = document.getElementById('categoryTitle');
      const countEl = document.getElementById('spotCount');
      const loadingEl = document.getElementById('loading');
      const spotsListEl = document.getElementById('spotsList');
      const emptyStateEl = document.getElementById('emptyState');

      loadingEl.classList.remove('hidden');
      spotsListEl.classList.add('hidden');
      emptyStateEl.classList.add('hidden');

      if (searchQuery) {
        titleEl.innerText = `Search: "${searchQuery}"`;
      } else {
        titleEl.innerText = categoryNames[categoryType] || 'Bali Spots';
      }

      let spots = mockDatabase[categoryType] || [
        { name: "SpotBali Hub 1", area: "Canggu, Bali", rating: "4.8", price: "$400 / mo", image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80", amenity: "📶 Wifi 150Mbps • 🏊 Pool" },
        { name: "Nomad Sanctuary Bali", area: "Ubud, Bali", rating: "4.9", price: "$450 / mo", image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=600&q=80", amenity: "📶 Wifi 200Mbps • 🌿 Quiet Area" }
      ];

      setTimeout(() => {
        loadingEl.classList.add('hidden');
        if (spots.length > 0) {
          countEl.innerText = `${spots.length} listings found`;
          spotsListEl.innerHTML = spots.map(spot => `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col sm:flex-row hover:border-slate-700 transition-all group">
              
              <!-- Foto Tempat -->
              <div class="sm:w-36 h-40 sm:h-auto relative shrink-0 overflow-hidden bg-slate-800">
                <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute top-2.5 left-2.5 bg-slate-950/80 backdrop-blur text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 border border-slate-800">
                  ★ ${spot.rating}
                </div>
              </div>

              <!-- Detail Informasi -->
              <div class="p-4 flex-1 flex flex-col justify-between gap-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h3 class="font-bold text-sm text-slate-100 leading-snug">${escapeHtml(spot.name)}</h3>
                    <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                      <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400 inline"></i>
                      ${escapeHtml(spot.area)}
                    </p>
                    <p class="text-[11px] text-slate-300 font-medium mt-2 bg-slate-950/50 px-2 py-1 rounded-lg border border-slate-800/80 inline-block">
                      ${escapeHtml(spot.amenity)}
                    </p>
                  </div>

                  <!-- TOMBOL CHAT HANYA MUNCUL JIKA INI KATEGORI SOSIAL (COMMUNITY FOCUS) -->
                  ${isSocialCategory ? `
                    <button onclick="goToChat('${escapeHtml(spot.name)}')" title="Join Community Chat" class="w-9 h-9 rounded-xl bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-slate-950 border border-emerald-500/30 flex items-center justify-center transition-all shrink-0 shadow-sm">
                      <i data-lucide="message-square" class="w-4 h-4"></i>
                    </button>
                  ` : ''}
                </div>

                <!-- Bagian Harga / Status -->
                <div class="flex items-center justify-between pt-2.5 border-t border-slate-800/80">
                  <span class="text-xs text-slate-400 font-medium">${isSocialCategory ? 'Status' : 'Starting from'}</span>
                  <span class="text-xs font-bold text-emerald-400 font-mono">${escapeHtml(spot.price)}</span>
                </div>
              </div>

            </div>
          `).join('');
          spotsListEl.classList.remove('hidden');
        } else {
          emptyStateEl.classList.remove('hidden');
        }
        lucide.createIcons();
      }, 300);
    }

    function goToChat(spotName) {
      const room = encodeURIComponent(spotName.toLowerCase().replace(/\s+/g, '-'));
      window.location.href = `messages.html?room=${room}`;
    }

    function escapeHtml(text) {
      return text.replace(/"/g, '&quot;');
    }

    loadCategoryData();
    lucide.createIcons();
  </script>
</body>
</html>
