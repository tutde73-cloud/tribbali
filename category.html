<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>SpotTribe Bali — Category Directory</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding-bottom: 70px; }
    .glass-nav-dark { background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
</head>
<body class="flex flex-col text-slate-800">

  <!-- HEADER -->
  <header class="glass-nav-dark border-b border-slate-800 px-6 h-[72px] flex items-center justify-between sticky top-0 z-50 shadow-lg">
    <div class="flex items-center gap-3.5">
      <a href="./index.html" class="w-10 h-10 rounded-xl bg-slate-800 text-white flex items-center justify-center hover:bg-slate-700 transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 id="categoryTitle" class="font-extrabold text-sm tracking-tight text-white uppercase">Category Directory</h1>
        <p class="text-[10px] text-slate-400 font-medium tracking-wide">SpotTribe Bali Curated Results</p>
      </div>
    </div>
  </header>

  <!-- CONTENT CONTAINER -->
  <main class="max-w-4xl mx-auto px-6 py-8 w-full">
    <div id="loadingState" class="text-center py-20 text-slate-400 font-medium">
      Loading curated spots...
    </div>

    <!-- Grid Kartu Horizontal Preview -->
    <div id="spotsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Hasil query Supabase akan dirender di sini secara dinamis -->
    </div>
  </main>

  <!-- SUPABASE FETCH SCRIPT -->
  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryType = urlParams.get('type');
    const searchQuery = urlParams.get('q');

    async function loadCategorySpots() {
      const container = document.getElementById('spotsContainer');
      const titleEl = document.getElementById('categoryTitle');
      const loadingEl = document.getElementById('loadingState');

      if (categoryType) {
        titleEl.innerText = `${categoryType} Spots`;
      } else if (searchQuery) {
        titleEl.innerText = `Search: "${searchQuery}"`;
      }

      try {
        let queryBuilder = clientSupabase.from('places').select('*');

        if (categoryType) {
          queryBuilder = queryBuilder.eq('category', categoryType);
        } else if (searchQuery) {
          queryBuilder = queryBuilder.ilike('name', `%${searchQuery}%`);
        }

        const { data: places, error } = await queryBuilder;

        if (error) throw error;

        loadingEl.style.display = 'none';

        if (!places || places.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-200">
              <p class="text-slate-500 font-semibold text-sm">No spots found in this category yet.</p>
              <a href="./index.html" class="inline-block mt-3 text-xs font-bold text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl">Back to Explore</a>
            </div>
          `;
          return;
        }

        container.innerHTML = places.map(spot => {
          const spotImage = spot.image_url || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80';
          // Ambil link maps dari database, atau buat link pencarian Google Maps jika kosong
          const mapLink = spot.map_url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name + ', ' + (spot.area || 'Bali'))}`;
          
          // Format tampilan teks link untuk bagian bawah (misal memotong teks https:// agar mirip maps.app.goo.gl)
          const displayLinkText = mapLink.includes('maps.app.goo.gl') ? 'maps.app.goo.gl' : 'Open in Google Maps';

          return `
            <div class="bg-white rounded-3xl border border-slate-200/90 overflow-hidden shadow-sm hover:shadow-md transition flex flex-row items-stretch p-3 gap-4">
              
              <!-- FOTO DI SEBELAH KIRI -->
              <div class="relative w-36 sm:w-40 h-auto min-h-[120px] rounded-2xl overflow-hidden bg-slate-100 flex-shrink-0">
                <img src="${spotImage}" class="w-full h-full object-cover" alt="${escapeHtml(spot.name)}" />
                <div class="absolute top-2 left-2 bg-slate-900/70 backdrop-blur-md px-2 py-0.5 rounded-full text-[10px] font-black text-emerald-400">
                  ★ ${spot.rating || '4.5'}
                </div>
              </div>

              <!-- KONTEN DI SEBELAH KANAN -->
              <div class="flex flex-col justify-between py-1 pr-2 flex-grow min-w-0">
                <div>
                  <h3 class="font-extrabold text-slate-900 text-sm leading-tight truncate">${escapeHtml(spot.name)}</h3>
                  <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed">
                    📍 ${escapeHtml(spot.area || spot.regency || 'Bali')}
                  </p>
                </div>

                <!-- LINK MAPS -->
                <div class="pt-2 mt-auto">
                  <a href="${mapLink}" target="_blank" class="text-xs font-semibold text-sky-600 hover:text-sky-700 hover:underline flex items-center gap-1 truncate">
                    <span>🗺️</span> <span>${displayLinkText}</span>
                  </a>
                </div>
              </div>

            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loading category spots:', err);
        loadingEl.innerText = 'Failed to load data. Please check your connection.';
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadCategorySpots();
    lucide.createIcons();
  </script>
</body>
</html>
