<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali - Explore Spots</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- CDN Supabase SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col pb-24">

  <!-- TOP HEADER BAR -->
  <header class="h-16 bg-white/90 backdrop-blur border-b border-slate-200 px-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-600 hover:text-slate-900 transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div>
        <h1 id="categoryTitle" class="font-bold text-base text-slate-900 capitalize leading-tight">Exploring Spots</h1>
        <p id="spotCount" class="text-[11px] text-slate-500">Connecting to Supabase...</p>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 p-4 max-w-xl mx-auto w-full">

    <!-- UI TOMBOL FILTER SORTIR -->
    <div id="filterSection" class="flex items-center gap-2 mb-4 hidden">
      <span class="text-xs text-slate-500 font-medium mr-1">Sort by:</span>
      <button onclick="sortPlaces('rating')" id="sortRatingBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 shadow-sm hover:border-emerald-500 transition-all flex items-center gap-1">
        ⭐ Verified First
      </button>
      <button onclick="sortPlaces('price')" id="sortPriceBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 shadow-sm hover:border-emerald-500 transition-all flex items-center gap-1">
        📍 Area
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400 gap-3">
      <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs font-medium text-slate-500">Fetching real-time data from Supabase...</p>
    </div>

    <!-- Spots Card Grid -->
    <div id="spotsList" class="flex flex-col gap-4 hidden"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 px-4">
      <div class="w-12 h-12 rounded-2xl bg-white text-slate-400 flex items-center justify-center mx-auto mb-3 border border-slate-200 shadow-sm">
        <i data-lucide="map-pin-off" class="w-6 h-6"></i>
      </div>
      <h3 class="text-sm font-semibold text-slate-800 mb-1">No spots found</h3>
      <p class="text-xs text-slate-500 max-w-xs mx-auto mb-4">No listings available in Supabase for this category right now.</p>
      <button onclick="loadPlacesFromSupabase(categoryType)" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold hover:bg-emerald-700 transition-colors shadow-sm">
        Try Again
      </button>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur border-t border-slate-200 flex items-center justify-around px-4 z-30 shadow-lg">
    <a href="index.html" class="flex flex-col items-center gap-1 text-emerald-600">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Explore</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Chats</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
  </nav>

  <!-- DATABASE LOKAL -->
  <script src="database.js"></script>

  <!-- SUPABASE & RENDER LOGIC -->
  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const categoryType = urlParams.get('type') || 'cafe';
    const searchQuery = urlParams.get('q') || urlParams.get('search');

    let currentPlaces = [];
    let activeSort = null;

    async function loadPlacesFromSupabase(rawType) {
      const titleEl = document.getElementById('categoryTitle');
      const countEl = document.getElementById('spotCount');
      const loadingEl = document.getElementById('loading');
      const spotsListEl = document.getElementById('spotsList');
      const emptyStateEl = document.getElementById('emptyState');
      const filterSection = document.getElementById('filterSection');

      loadingEl.classList.remove('hidden');
      spotsListEl.classList.add('hidden');
      emptyStateEl.classList.add('hidden');
      filterSection.classList.add('hidden');

      if (searchQuery) {
        titleEl.innerText = `Search: "${searchQuery}"`;
      } else {
        titleEl.innerText = (typeof categoryNames !== 'undefined' && categoryNames[rawType]) ? categoryNames[rawType] : 'Bali Spots';
      }

      try {
        let query = clientSupabase.from('places').select('*');

        if (searchQuery) {
          query = query.ilike('name', `%${searchQuery}%`);
        } else {
          const type = rawType.toLowerCase().trim();
          let dbCategory = type;

          if (type.includes('hotel') || type.includes('resort')) {
            dbCategory = 'hotel';
          } else if (type.includes('nightclub')) {
            dbCategory = 'nightclub';
          } else if (type.includes('beachclub') || type.includes('beach-club')) {
            dbCategory = 'beachclub';
          } else if (type.includes('beach') || type.includes('surf')) {
            dbCategory = 'beach';
          } else if (type.includes('villa') || type.includes('house')) {
            dbCategory = 'villas';
          } else if (type.includes('waterfall')) {
            dbCategory = 'waterfall';
          } else if (type.includes('coliving')) {
            dbCategory = 'coliving';
          } else if (type.includes('coworking') || type.includes('work')) {
            dbCategory = 'coworking';
          } else if (type.includes('cafe') || type.includes('brunch')) {
            dbCategory = 'cafe';
          } else if (type.includes('vehicle') || type.includes('rent') || type.includes('bike') || type.includes('car')) {
            dbCategory = 'vehicle';
          } else if (type.includes('volcano') || type.includes('trek') || type.includes('hiking')) {
            dbCategory = 'volcano';
          } else if (type.includes('wildlife') || type.includes('animal') || type.includes('forest')) {
            dbCategory = 'wildlife';
          } else if (type.includes('medical') || type.includes('clinic') || type.includes('hospital')) {
            dbCategory = 'medical';
          } else if (type.includes('visa') || type.includes('agency') || type.includes('legal')) {
            dbCategory = 'visa';
          } else if (type.includes('temple') || type.includes('culture') || type.includes('heritage')) {
            dbCategory = 'temple';
          } else if (type.includes('yoga') || type.includes('spa') || type.includes('wellness')) {
            dbCategory = 'wellness';
          }

          query = query.eq('category', dbCategory);
        }

        let { data: places, error } = await query;

        if (error) throw error;

        currentPlaces = places || [];
        loadingEl.classList.add('hidden');

        if (currentPlaces.length > 0) {
          filterSection.classList.remove('hidden');
          renderPlaces(currentPlaces);
          spotsListEl.classList.remove('hidden');
        } else {
          emptyStateEl.classList.remove('hidden');
        }

      } catch (err) {
        console.error('Connection or Query Failed:', err);
        loadingEl.classList.add('hidden');
        emptyStateEl.classList.remove('hidden');
      }
    }

    function sortPlaces(criteria) {
      const ratingBtn = document.getElementById('sortRatingBtn');
      const priceBtn = document.getElementById('sortPriceBtn');

      if (activeSort === criteria) {
        activeSort = null;
        ratingBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 shadow-sm hover:border-emerald-500 transition-all flex items-center gap-1";
        priceBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 shadow-sm hover:border-emerald-500 transition-all flex items-center gap-1";
        renderPlaces(currentPlaces);
        return;
      }

      activeSort = criteria;

      if (criteria === 'rating') {
        currentPlaces.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        ratingBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white border border-emerald-500 shadow-sm transition-all flex items-center gap-1";
        priceBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 shadow-sm hover:border-emerald-500 transition-all flex items-center gap-1";
      } else if (criteria === 'price') {
        currentPlaces.sort((a, b) => (a.area || '').localeCompare(b.area || ''));
        ratingBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 shadow-sm hover:border-emerald-500 transition-all flex items-center gap-1";
        priceBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white border border-emerald-500 shadow-sm transition-all flex items-center gap-1";
      }

      renderPlaces(currentPlaces);
    }

    // RENDER KARTU TEMPAT
    function renderPlaces(places) {
      const spotsListEl = document.getElementById('spotsList');
      const countEl = document.getElementById('spotCount');
      
      if (countEl) {
        countEl.innerText = `${places.length} listings found`;
      }

      spotsListEl.innerHTML = places.map((spot) => `
        <div onclick="focusSpotOnMap(${spot.latitude || -8.5500}, ${spot.longitude || 115.1800})" 
             class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col sm:flex-row hover:border-emerald-500 hover:shadow-md transition-all group cursor-pointer">
          
          <!-- Foto Tempat -->
          <div class="sm:w-36 h-40 sm:h-auto relative shrink-0 overflow-hidden bg-slate-100">
            <img src="${spot.image_url || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80'}" 
                 alt="${escapeHtml(spot.name)}" 
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            
            <div class="absolute top-2.5 left-2.5 bg-white/95 backdrop-blur text-amber-600 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1 border border-slate-200 shadow-sm">
              ⭐ Verified Spot
            </div>
          </div>

          <!-- Detail Informasi -->
          <div class="p-4 flex-1 flex flex-col justify-between gap-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h3 class="font-bold text-sm text-slate-900 leading-snug group-hover:text-emerald-600 transition-colors">
                  ${escapeHtml(spot.name)}
                </h3>
                <p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-600 inline"></i>
                  ${escapeHtml(spot.area || 'Bali')}
                </p>
                
                <p class="text-[11px] text-slate-600 font-medium mt-2 bg-slate-50 px-2 py-1 rounded-lg border border-slate-200 inline-block">
                  🌴 Explore Bali • Verified Location
                </p>
              </div>
            </div>

            <!-- Teks Harga Jujur ("Contact for Rates") -->
            <div class="flex items-center justify-between pt-2.5 border-t border-slate-100">
              <span class="text-xs text-slate-400 font-medium">Inquiry & Info</span>
              <span class="text-xs font-bold text-emerald-600 font-sans tracking-wide bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-100">
                Contact for Rates
              </span>
            </div>
          </div>

        </div>
      `).join('');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function focusSpotOnMap(lat, lng) {
      if (typeof map !== 'undefined' && map && lat && lng) {
        map.flyTo([lat, lng], 15, { animate: true, duration: 1.2 });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function escapeHtml(text) {
      return text ? text.toString().replace(/"/g, '&quot;').replace(/'/g, '&#39;') : '';
    }

    loadPlacesFromSupabase(categoryType);
    lucide.createIcons();
  </script>
</body>
</html>
