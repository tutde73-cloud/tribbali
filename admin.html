<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SpotTribe Bali</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <div class="max-w-5xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <h1 class="text-lg font-bold tracking-tight text-white">SpotTribe Admin Panel</h1>
      </div>
      <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl border border-slate-700 transition">← Back to App</a>
    </div>

    <!-- Form Section -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-8 shadow-xl">
      <h2 id="formTitle" class="text-sm font-bold text-amber-400 mb-4">➕ Add New Curated Spot</h2>
      
      <form id="adminSpotForm" onsubmit="handleSaveSpot(event)" class="space-y-4">
        <input type="hidden" id="spotId">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Spot Name</label>
            <input type="text" id="spotName" required class="w-full text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="e.g. Alila Villas Uluwatu">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
            <select id="spotCategory" class="w-full text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500">
              <option value="Villas">Villas</option>
              <option value="Stays">Stays</option>
              <option value="Coworking">Coworking</option>
              <option value="Cafes">Cafes</option>
              <option value="Restaurants">Restaurants</option>
              <option value="Culture">Culture</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Area / Location</label>
            <input type="text" id="spotArea" required class="w-full text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="e.g. Uluwatu">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Rating</label>
            <input type="text" id="spotRating" required class="w-full text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="e.g. 4.9">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Price Label</label>
            <input type="text" id="spotPrice" required class="w-full text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="e.g. $$$ or Contact for Rates">
          </div>
          <div>
            <!-- FITUR UPLOAD FILE KE SUPABASE STORAGE -->
            <label class="block text-xs font-semibold text-slate-400 mb-1">Upload Foto Utama (File)</label>
            <input type="file" id="spotImageFile" accept="image/*" class="w-full text-xs border border-slate-800 rounded-xl px-3 py-2 bg-slate-950 text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
            <!-- Hidden input untuk menyimpan URL gambar lama saat mode Edit -->
            <input type="hidden" id="existingImageUrl">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Amenities / Facilities (Gunakan pemisah titik • atau koma)</label>
          <input type="text" id="spotAmenity" required class="w-full text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-amber-500" placeholder="e.g. Ocean View • Private Pool • Sustainable Eco-Luxury">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition">Cancel Edit</button>
          <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-lg shadow-amber-500/10">Save Spot to Database</button>
        </div>
      </form>
    </div>

    <!-- Managed Places Directory Section -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
      <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3">
        <div>
          <h2 class="text-sm font-bold text-white">📂 Managed Places Directory</h2>
          <p class="text-[11px] text-slate-400">Filter and edit database entries by category or search term.</p>
        </div>
        
        <div class="flex gap-2 w-full md:w-auto">
          <input type="text" id="directorySearch" oninput="fetchAdminSpots()" placeholder="Search..." class="text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500">
          <select id="directoryFilter" onchange="fetchAdminSpots()" class="text-xs bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-300 focus:outline-none">
            <option value="">All Categories</option>
            <option value="Villas">Villas</option>
            <option value="Stays">Stays</option>
            <option value="Coworking">Coworking</option>
            <option value="Cafes">Cafes</option>
            <option value="Restaurants">Restaurants</option>
            <option value="Culture">Culture</option>
          </select>
        </div>
      </div>

      <div id="adminSpotsContainer" class="space-y-3">
        <!-- List card item akan dirender lewat JavaScript di sini -->
      </div>
    </div>
  </div>

  <!-- Script Logika -->
  <script>
    // Konfigurasi Supabase Anda
    const SUPABASE_URL = 'ISI_SUPABASE_URL_ANDA'; 
    const SUPABASE_KEY = 'ISI_SUPABASE_ANON_KEY_ANDA';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", () => {
      fetchAdminSpots();
    });

    async function fetchAdminSpots() {
      const categoryFilter = document.getElementById('directoryFilter').value;
      const searchQuery = document.getElementById('directorySearch').value.toLowerCase();

      let query = clientSupabase.from('places').select('*').order('id', { ascending: false });

      if (categoryFilter) {
        query = query.eq('category', categoryFilter);
      }

      const { data, error } = await query;
      const container = document.getElementById('adminSpotsContainer');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<div class="p-4 text-red-400 text-xs text-center">Error loading data: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="p-4 text-slate-500 text-xs text-center">No spots found in database.</div>`;
        return;
      }

      const filtered = data.filter(spot => 
        spot.name.toLowerCase().includes(searchQuery) || 
        spot.area.toLowerCase().includes(searchQuery)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-4 text-slate-500 text-xs text-center">No matching search results.</div>`;
        return;
      }

      filtered.forEach(spot => {
        const card = document.createElement('div');
        card.className = "flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl hover:border-slate-700 transition";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${spot.image_url || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e'}" class="w-12 h-12 rounded-lg object-cover border border-slate-800" alt="">
            <div>
              <div class="font-bold text-xs text-slate-100">${spot.name}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">🏷️ ${spot.category} &nbsp;•&nbsp; 📍 ${spot.area}</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="editSpot(${spot.id}, '${escapeJs(spot.name)}', '${spot.category}', '${escapeJs(spot.area)}', '${spot.rating}', '${escapeJs(spot.price_label)}', '${spot.image_url || ''}', '${escapeJs(spot.amenity)}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg transition font-medium">Edit</button>
            <button onclick="deleteSpot(${spot.id})" class="px-3 py-1.5 bg-red-950/40 hover:bg-red-900/60 text-red-400 text-xs rounded-lg border border-red-900/30 transition font-medium">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Fungsi Simpan (Insert / Update) dengan Upload File ke Supabase Storage
    async function handleSaveSpot(event) {
      event.preventDefault();
      const id = document.getElementById('spotId').value;
      const categoryValue = document.getElementById('spotCategory').value;
      const fileInput = document.getElementById('spotImageFile');
      
      let imageUrl = document.getElementById('existingImageUrl').value;

      // 1. Jika admin memilih file gambar baru, upload ke bucket 'spot-images'
      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

        const { data: uploadData, error: uploadError } = await clientSupabase.storage
          .from('spot-images')
          .upload(fileName, file);

        if (uploadError) {
          alert("Gagal meng-upload gambar: " + uploadError.message);
          return;
        }

        // Ambil Public URL dari file yang di-upload
        const { data: publicURLData } = clientSupabase.storage
          .from('spot-images')
          .getPublicUrl(fileName);

        imageUrl = publicURLData.publicUrl;
      }

      // 2. Siapkan payload data database
      const payload = {
        name: document.getElementById('spotName').value,
        category: categoryValue,
        area: document.getElementById('spotArea').value,
        rating: document.getElementById('spotRating').value,
        price_label: document.getElementById('spotPrice').value,
        image_url: imageUrl,
        amenity: document.getElementById('spotAmenity').value
      };

      // 3. Simpan ke tabel 'places'
      if (id) {
        const { error } = await clientSupabase.from('places').update(payload).eq('id', id);
        if (error) { alert("Error updating: " + error.message); return; }
        alert("Spot updated successfully!");
      } else {
        const { error } = await clientSupabase.from('places').insert([payload]);
        if (error) { alert("Error inserting: " + error.message); return; }
        alert("Spot added successfully!");
      }

      document.getElementById('directoryFilter').value = categoryValue;
      document.getElementById('directorySearch').value = '';
      resetForm();
      fetchAdminSpots();
    }

    function editSpot(id, name, category, area, rating, price, imageUrl, amenity) {
      document.getElementById('spotId').value = id;
      document.getElementById('spotName').value = name;
      document.getElementById('spotCategory').value = category;
      document.getElementById('spotArea').value = area;
      document.getElementById('spotRating').value = rating;
      document.getElementById('spotPrice').value = price;
      document.getElementById('existingImageUrl').value = imageUrl;
      document.getElementById('spotAmenity').value = amenity;

      document.getElementById('formTitle').innerText = "✏️ Edit Spot ID: " + id;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteSpot(id) {
      if (!confirm("Are you sure you want to delete this spot?")) return;

      const { error } = await clientSupabase.from('places').delete().eq('id', id);
      if (error) {
        alert("Error deleting: " + error.message);
        return;
      }
      alert("Spot deleted successfully!");
      fetchAdminSpots();
    }

    function resetForm() {
      document.getElementById('adminSpotForm').reset();
      document.getElementById('spotId').value = '';
      document.getElementById('existingImageUrl').value = '';
      document.getElementById('formTitle').innerText = "➕ Add New Curated Spot";
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    function escapeJs(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
