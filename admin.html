<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - SpotTribe Bali</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">🛠️ SpotTribe Admin Panel</h1>
        <p class="text-xs text-slate-400 mt-1">Manage spots, uploads, and directory content.</p>
      </div>
      <div class="mt-4 md:mt-0 flex gap-3">
        <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl border border-slate-700 transition">View Live Site</a>
      </div>
    </header>

    <!-- Main Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Form Section (Left Column) -->
      <div class="lg:col-span-1 bg-slate-800/50 border border-slate-800 p-5 rounded-2xl h-fit">
        <h2 id="formTitle" class="text-sm font-bold text-sky-400 mb-4">➕ Add New Curated Spot</h2>
        
        <form id="adminSpotForm" onsubmit="handleSaveSpot(event)" class="space-y-4">
          <input type="hidden" id="spotId">
          
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Spot Name</label>
            <input type="text" id="spotName" required class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500" placeholder="e.g. Alila Villas">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Category</label>
            <select id="spotCategory" class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="Stay">Stay</option>
              <option value="Work">Work</option>
              <option value="Coffee">Coffee</option>
              <option value="Eat">Eat</option>
              <option value="Culture">Culture</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Area / Location</label>
            <input type="text" id="spotArea" required class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500" placeholder="e.g. Uluwatu, Bali">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Rating</label>
              <input type="text" id="spotRating" required class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500" placeholder="e.g. 4.9">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Price Label</label>
              <input type="text" id="spotPrice" required class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500" placeholder="e.g. $$">
            </div>
          </div>

          <!-- File Upload untuk Supabase Storage -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Upload Photo (File)</label>
            <input type="file" id="spotImageFile" accept="image/*" class="w-full text-xs border border-slate-700 rounded-xl px-3 py-2 bg-slate-900 text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-500 file:text-slate-950 hover:file:bg-sky-400 cursor-pointer">
            <!-- Hidden input untuk menampung URL lama saat mode edit -->
            <input type="hidden" id="existingImageUrl">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Amenities / Tags</label>
            <input type="text" id="spotAmenity" required class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500" placeholder="e.g. Private Pool • High-Speed WiFi">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition">Save Spot</button>
            <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs rounded-xl transition">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Data List Table (Right Column) -->
      <div class="lg:col-span-2 bg-slate-800/50 border border-slate-800 p-5 rounded-2xl">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
          <h2 class="text-sm font-bold text-slate-200">📂 Existing Spots Database</h2>
          
          <div class="flex gap-2 w-full sm:w-auto">
            <select id="directoryFilter" onchange="fetchAdminSpots()" class="text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-300">
              <option value="">All Categories</option>
              <option value="Stay">Stay</option>
              <option value="Work">Work</option>
              <option value="Coffee">Coffee</option>
              <option value="Eat">Eat</option>
              <option value="Culture">Culture</option>
            </select>
            <input type="text" id="directorySearch" oninput="fetchAdminSpots()" placeholder="Search..." class="text-xs bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-900 text-slate-400 uppercase tracking-wider">
              <tr>
                <th class="p-3">Spot</th>
                <th class="p-3">Category</th>
                <th class="p-3">Area</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="adminSpotsTableBody" class="divide-y divide-slate-800">
              <!-- Dynamic Rows Inserted via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Supabase Initialization Script -->
  <script>
    // Konfigurasi Kunci Supabase Anda
    const SUPABASE_URL = 'ISI_SUPABASE_URL_ANDA'; 
    const SUPABASE_KEY = 'ISI_SUPABASE_ANON_KEY_ANDA';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ambil data saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
      fetchAdminSpots();
    });

    async function fetchAdminSpots() {
      const categoryFilter = document.getElementById('directoryFilter').value;
      const searchQuery = document.getElementById('directorySearch').value.toLowerCase();

      let query = clientSupabase.from('places').select('*').order('id', { ascending: false });

      if (categoryFilter) {
        query = query.eq('category', categoryFilter);
      }

      const { data, error } = await query;
      const tbody = document.getElementById('adminSpotsTableBody');
      tbody.innerHTML = '';

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-red-400 text-center">Error loading data: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-slate-500 text-center">No spots found.</td></tr>`;
        return;
      }

      // Filter lokal untuk search query
      const filtered = data.filter(spot => 
        spot.name.toLowerCase().includes(searchQuery) || 
        spot.area.toLowerCase().includes(searchQuery)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-slate-500 text-center">No matching search results.</td></tr>`;
        return;
      }

      filtered.forEach(spot => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 transition";
        tr.innerHTML = `
          <td class="p-3 flex items-center gap-3">
            <img src="${spot.image_url || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e'}" class="w-10 h-10 rounded-lg object-cover border border-slate-700" alt="">
            <div>
              <div class="font-semibold text-slate-100">${spot.name}</div>
              <div class="text-[10px] text-slate-500">${spot.price_label} • ⭐ ${spot.rating}</div>
            </div>
          </td>
          <td class="p-3"><span class="px-2 py-0.5 bg-sky-950 text-sky-300 border border-sky-800/50 rounded-md text-[10px]">${spot.category}</span></td>
          <td class="p-3 text-slate-400">${spot.area}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="editSpot(${spot.id}, '${escapeJs(spot.name)}', '${spot.category}', '${escapeJs(spot.area)}', '${spot.rating}', '${spot.price_label}', '${spot.image_url || ''}', '${escapeJs(spot.amenity)}')" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-[10px] transition">Edit</button>
            <button onclick="deleteSpot(${spot.id})" class="px-2.5 py-1 bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-900/50 rounded-lg text-[10px] transition">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Handle Simpan (Insert / Update) beserta File Upload ke Supabase Storage
    async function handleSaveSpot(event) {
      event.preventDefault();
      const id = document.getElementById('spotId').value;
      const categoryValue = document.getElementById('spotCategory').value;
      const fileInput = document.getElementById('spotImageFile');
      
      let imageUrl = document.getElementById('existingImageUrl').value;

      // 1. Jika admin melampirkan file gambar baru, upload ke bucket 'spot-images'
      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

        const { data: uploadData, error: uploadError } = await clientSupabase.storage
          .from('spot-images')
          .upload(fileName, file);

        if (uploadError) {
          alert("Gagal meng-upload gambar: " + uploadError.message);
          return;
        }

        // Ambil Public URL dari file yang sukses di-upload
        const { data: publicURLData } = clientSupabase.storage
          .from('spot-images')
          .getPublicUrl(fileName);

        imageUrl = publicURLData.publicUrl;
      }

      // 2. Susun payload data database
      const payload = {
        name: document.getElementById('spotName').value,
        category: categoryValue,
        area: document.getElementById('spotArea').value,
        rating: document.getElementById('spotRating').value,
        price_label: document.getElementById('spotPrice').value,
        image_url: imageUrl,
        amenity: document.getElementById('spotAmenity').value
      };

      // 3. Simpan ke tabel 'places'
      if (id) {
        const { error } = await clientSupabase.from('places').update(payload).eq('id', id);
        if (error) { alert("Error updating: " + error.message); return; }
        alert("Spot updated successfully!");
      } else {
        const { error } = await clientSupabase.from('places').insert([payload]);
        if (error) { alert("Error inserting: " + error.message); return; }
        alert("Spot added successfully!");
      }

      document.getElementById('directoryFilter').value = categoryValue;
      document.getElementById('directorySearch').value = '';
      resetForm();
      fetchAdminSpots();
    }

    function editSpot(id, name, category, area, rating, price, imageUrl, amenity) {
      document.getElementById('spotId').value = id;
      document.getElementById('spotName').value = name;
      document.getElementById('spotCategory').value = category;
      document.getElementById('spotArea').value = area;
      document.getElementById('spotRating').value = rating;
      document.getElementById('spotPrice').value = price;
      document.getElementById('existingImageUrl').value = imageUrl;
      document.getElementById('spotAmenity').value = amenity;

      document.getElementById('formTitle').innerText = "✏️ Edit Spot ID: " + id;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteSpot(id) {
      if (!confirm("Are you sure you want to delete this spot?")) return;

      const { error } = await clientSupabase.from('places').delete().eq('id', id);
      if (error) {
        alert("Error deleting: " + error.message);
        return;
      }
      alert("Spot deleted successfully!");
      fetchAdminSpots();
    }

    function resetForm() {
      document.getElementById('adminSpotForm').reset();
      document.getElementById('spotId').value = '';
      document.getElementById('existingImageUrl').value = '';
      document.getElementById('formTitle').innerText = "➕ Add New Curated Spot";
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    function escapeJs(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
