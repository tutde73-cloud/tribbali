<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali - Admin Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center">
    
    <h1 class="font-bold text-lg text-slate-100 mb-2">SpotTribe Admin</h1>
    <p class="text-xs text-slate-400 mb-6">Panel Sinkronisasi Data Bali</p>

    <!-- Tombol Utama -->
    <button onclick="runSync()" id="actionBtn" class="w-full py-4 px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-2xl shadow-lg transition-all">
      🚀 Mulai Tarik Data Foursquare
    </button>

    <!-- Kotak Status -->
    <div id="logBox" class="mt-4 p-3 bg-slate-950 rounded-xl text-left font-mono text-[11px] text-emerald-400 hidden">
      Menunggu perintah...
    </div>

    <div class="mt-6">
      <a href="index.html" class="text-xs text-slate-400 underline">Kembali ke Beranda</a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://riyupzmlltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const FOURSQUARE_API_KEY = "RJGHDSELHYZRFN3SMIISKNQ4XZYBD55OR24MFEC0UPWIAAOL";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function runSync() {
      const logBox = document.getElementById('logBox');
      const btn = document.getElementById('actionBtn');
      
      logBox.classList.remove('hidden');
      logBox.innerText = "⏳ Memulai proses...";
      btn.disabled = true;
      btn.style.opacity = "0.5";

      try {
        // Data sampel uji coba langsung ke Supabase agar instan masuk
        const sampleData = [
          { category: 'cafe', name: 'Revolver Seminyak', area: 'Seminyak', rating: 4.8, price: 50000, price_label: 'IDR 50k - 150k', image_url: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=600&q=80', amenity: 'Seminyak • Verified' },
          { category: 'villas', name: 'Theanna Villa Canggu', area: 'Canggu', rating: 4.9, price: 1500000, price_label: 'IDR 1.5M / night', image_url: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=600&q=80', amenity: 'Canggu • Verified' },
          { category: 'nightclub', name: 'La Favela', area: 'Seminyak', rating: 4.7, price: 150000, price_label: 'IDR 150k / entry', image_url: 'https://images.unsplash.com/photo-1566737236500-c8ac43014a67?auto=format&fit=crop&w=600&q=80', amenity: 'Seminyak • Verified' },
          { category: 'rental', name: 'Canggu Scooter Rental', area: 'Canggu', rating: 4.8, price: 70000, price_label: 'IDR 70k / day', image_url: 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=600&q=80', amenity: 'Canggu • Verified' }
        ];

        logBox.innerText = "📥 Menyimpan data ke Supabase...";

        const { error } = await supabase
          .from('places')
          .upsert(sampleData, { onConflict: 'name,area' });

        if (error) throw error;

        logBox.innerText = "✅ SUKSES! Data berhasil masuk ke database.";
        btn.disabled = false;
        btn.style.opacity = "1";

      } catch (err) {
        logBox.innerText = "❌ ERROR: " + err.message;
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    }
  </script>
</body>
</html>
