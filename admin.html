<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali — Admin Dashboard</title>

  <!-- Tailwind CSS & Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER NAVBAR -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚡</span>
        <h1 class="font-extrabold text-base tracking-tight">SpotTribe Admin Panel</h1>
      </div>
      <a href="./index.html" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl transition">
        ← Back to App
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-5xl mx-auto px-6 py-8 flex-grow w-full space-y-8">
    
    <!-- SECTION: FORM TAMBAH / EDIT SPOT -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
      <h2 id="formTitle" class="font-bold text-lg text-slate-900 mb-4">➕ Add New Curated Spot</h2>
      
      <form id="adminSpotForm" onsubmit="handleSaveSpot(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input type="hidden" id="spotId">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Spot Name</label>
          <input type="text" id="spotName" required placeholder="e.g. Flamingo Black Sand Dayclub" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
          <select id="spotCategory" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500 bg-white font-medium">
            <option value="beachclub">Beach Clubs (beachclub)</option>
            <option value="villas">Villas (villas)</option>
            <option value="waterfall">Waterfall (waterfall)</option>
            <option value="cafes">Cafes (cafes)</option>
            <option value="coworking">Coworking (coworking)</option>
            <option value="stays">Stays (stays)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Area / Location</label>
          <input type="text" id="spotArea" required placeholder="e.g. Gianyar / Canggu / Uluwatu" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Rating</label>
          <input type="text" id="spotRating" value="4.5" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Price Label</label>
          <input type="text" id="spotPrice" value="Contact for Rates" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Image URL (Foto Utama)</label>
          <input type="url" id="spotImage" placeholder="https://images.unsplash.com/..." class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500">
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Amenities / Facilities (Gunakan pemisah titik • atau koma)</label>
          <input type="text" id="spotAmenity" placeholder="Infinity Pool • Ocean View • Daybed Reservation" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-sky-500">
        </div>

        <div class="sm:col-span-2 flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel Edit</button>
          <button type="submit" class="px-6 py-2.5 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition shadow-md shadow-sky-600/20">Save Spot to Database</button>
        </div>
      </form>
    </div>

    <!-- SECTION: LIST DATA SPOTS WITH CATEGORY FILTER -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-100">
        <div>
          <h2 class="font-bold text-lg text-slate-900">📁 Managed Places Directory</h2>
          <p class="text-xs text-slate-500">Filter and edit database entries by category.</p>
        </div>
        
        <!-- CATEGORY FILTER DROPDOWN -->
        <div class="flex items-center gap-2">
          <label for="directoryFilter" class="text-xs font-bold text-slate-600">Filter Category:</label>
          <select id="directoryFilter" onchange="fetchAdminSpots()" class="text-xs border border-slate-300 rounded-xl px-3 py-2 bg-slate-50 font-bold text-slate-800 focus:outline-none focus:border-sky-500">
            <option value="all">ALL Categories</option>
            <option value="beachclub">Beach Clubs</option>
            <option value="villas">Villas</option>
            <option value="waterfall">Waterfall</option>
            <option value="cafes">Cafes</option>
            <option value="coworking">Coworking</option>
            <option value="stays">Stays</option>
          </select>
        </div>
      </div>

      <div id="adminSpotsContainer" class="space-y-3">
        <p class="text-slate-400 text-xs italic text-center py-6">Loading spots data...</p>
      </div>
    </div>

  </main>

  <!-- SCRIPT ADMIN -->
  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchAdminSpots() {
      const container = document.getElementById('adminSpotsContainer');
      const selectedCategory = document.getElementById('directoryFilter').value;

      let query = clientSupabase.from('places').select('*').order('id', { ascending: false });
      
      if (selectedCategory !== 'all') {
        query = query.eq('category', selectedCategory);
      }

      const { data, error } = await query;

      if (error) {
        container.innerHTML = `<p class="text-rose-500 text-xs text-center">Failed to load places.</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs italic text-center py-6">No places found in category "${selectedCategory}".</p>`;
        return;
      }

      container.innerHTML = data.map(spot => `
        <div class="flex items-center justify-between p-4 rounded-2xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 transition gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <img src="${spot.image_url || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=150&q=80'}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0 border border-slate-200" />
            <div class="min-w-0">
              <h4 class="font-bold text-slate-900 text-sm truncate">${escapeHtml(spot.name)}</h4>
              <p class="text-[11px] text-slate-500 font-medium">📂 <strong class="text-slate-700">${escapeHtml(spot.category)}</strong> • 📍 ${escapeHtml(spot.area || spot.regency || 'Bali')}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button onclick="editSpot(${spot.id}, '${escapeHtml(spot.name)}', '${escapeHtml(spot.category)}', '${escapeHtml(spot.area || spot.regency || '')}', '${spot.rating || 4.5}', '${escapeHtml(spot.price_label || spot.price || '')}', '${escapeHtml(spot.image_url || '')}', '${escapeHtml(spot.amenity || '')}')" class="bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">
              Edit
            </button>
            <button onclick="deleteSpot(${spot.id})" class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">
              Delete
            </button>
          </div>
        </div>
      `).join('');
    }

    async function handleSaveSpot(event) {
      event.preventDefault();
      const id = document.getElementById('spotId').value;
      const categoryValue = document.getElementById('spotCategory').value;
      
      const payload = {
        name: document.getElementById('spotName').value,
        category: categoryValue,
        area: document.getElementById('spotArea').value,
        rating: document.getElementById('spotRating').value,
        price_label: document.getElementById('spotPrice').value,
        image_url: document.getElementById('spotImage').value,
        amenity: document.getElementById('spotAmenity').value
      };

      if (id) {
        const { error } = await clientSupabase.from('places').update(payload).eq('id', id);
        if (error) { alert("Error updating: " + error.message); return; }
        alert("Spot updated successfully!");
      } else {
        const { error } = await clientSupabase.from('places').insert([payload]);
        if (error) { alert("Error inserting: " + error.message); return; }
        alert("Spot added successfully!");
      }

      // Sync filter dropdown to show updated category
      document.getElementById('directoryFilter').value = categoryValue;
      resetForm();
      fetchAdminSpots();
    }

    function editSpot(id, name, category, area, rating, price, imageUrl, amenity) {
      document.getElementById('spotId').value = id;
      document.getElementById('spotName').value = name;
      document.getElementById('spotCategory').value = category;
      document.getElementById('spotArea').value = area;
      document.getElementById('spotRating').value = rating;
      document.getElementById('spotPrice').value = price;
      document.getElementById('spotImage').value = imageUrl;
      document.getElementById('spotAmenity').value = amenity;

      document.getElementById('formTitle').innerText = "✏️ Edit Spot ID: " + id;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('adminSpotForm').reset();
      document.getElementById('spotId').value = '';
      document.getElementById('formTitle').innerText = "➕ Add New Curated Spot";
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    async function deleteSpot(id) {
      if (!confirm("Are you sure you want to delete this spot?")) return;
      const { error } = await clientSupabase.from('places').delete().eq('id', id);
      if (error) { alert("Error deleting: " + error.message); return; }
      fetchAdminSpots();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    fetchAdminSpots();
  </script>
</body>
</html>
