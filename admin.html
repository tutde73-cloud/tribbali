<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali - Admin Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
    
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-100">SpotTribe Bali</h1>
        <p class="text-xs text-slate-400">Secure Admin Dashboard</p>
      </div>
    </div>

    <div class="p-3.5 bg-slate-950/60 border border-slate-800/80 rounded-2xl mb-6">
      <p class="text-xs text-slate-300 leading-relaxed">
        Klik tombol di bawah untuk menjalankan Edge Function dan menyinkronkan data Foursquare ke Supabase secara otomatis.
      </p>
    </div>

    <button onclick="triggerSyncFunction()" id="syncBtn" class="w-full py-4 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 mb-4">
      <i data-lucide="database" class="w-4 h-4"></i>
      <span>🚀 Sync Data Foursquare via Edge Function</span>
    </button>

    <div id="statusBox" class="hidden p-3.5 bg-slate-950 border border-slate-800 rounded-2xl">
      <p id="syncStatus" class="text-xs font-mono text-emerald-400 leading-relaxed">Menunggu perintah...</p>
    </div>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200 transition-colors inline-flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali ke Beranda Utama
      </a>
    </div>

  </div>

  <script>
    async function triggerSyncFunction() {
      const statusBox = document.getElementById('statusBox');
      const statusEl = document.getElementById('syncStatus');
      const btnEl = document.getElementById('syncBtn');

      statusBox.classList.remove('hidden');
      btnEl.disabled = true;
      btnEl.style.opacity = "0.5";
      statusEl.innerText = "⏳ Memanggil Edge Function di Supabase...";

      // URL Endpoint Edge Function Anda
      const FUNCTION_URL = 'https://riyupzmlltjrelqytwi.supabase.co/functions/v1/swift-action';
      const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ name: "AdminSync" })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Gagal menjalankan fungsi.');
        }

        statusEl.innerText = `✅ SUKSES! ${result.message || 'Data berhasil disinkronkan.'}`;
        btnEl.disabled = false;
        btnEl.style.opacity = "1";

      } catch (err) {
        console.error('Error:', err);
        statusEl.innerText = `❌ ERROR: ${err.message}`;
        btnEl.disabled = false;
        btnEl.style.opacity = "1";
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
