<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Detail | SpotTribe Bali</title>
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .glass-nav-dark { background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        /* Styling untuk konten artikel dari database */
        .article-content img { border-radius: 1.5rem; margin-top: 1.5rem; margin-bottom: 1.5rem; width: 100%; object-fit: cover; max-height: 450px; }
        .article-content p { margin-bottom: 1rem; line-height: 1.7; color: #334155; }
        .article-content h2 { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 2rem; margin-bottom: 0.75rem; }
        .article-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #334155; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 pb-16">

    <!-- HEADER NAVBAR -->
    <header class="glass-nav-dark border-b border-slate-800 px-6 h-[72px] flex items-center justify-between sticky top-0 z-50 shadow-lg">
        <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-2xl overflow-hidden bg-slate-900 border border-slate-700 shadow-md shadow-emerald-500/20 flex items-center justify-center shrink-0">
                <img src="./favicon.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="font-extrabold text-sm tracking-tight text-white flex items-center gap-2">
                    SpotTribe <span class="bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent text-[11px] font-mono uppercase px-2 py-0.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 font-bold">BALI</span>
                </h1>
                <p class="text-[10px] text-slate-400 font-medium tracking-wide">Elite Island Journal & Guides</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <a href="./journal.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-white transition border border-slate-700 shadow-sm">
                <i data-lucide="arrow-left" class="w-4 h-4 text-emerald-400"></i>
                <span>Back to Journal</span>
            </a>
        </div>
    </header>

    <!-- ARTICLE MAIN CONTAINER -->
    <main class="max-w-3xl mx-auto px-6 py-12 flex-grow w-full">
        <div id="articleDetailContainer" class="space-y-6">
            <!-- Loading State -->
            <div class="text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
                <p class="text-xs text-slate-400 mt-3 font-medium">Loading article details...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-300 py-8 px-6 border-t border-slate-800 text-center text-xs mt-auto">
        <p>© 2026 SpotTribe BALI. All rights reserved.</p>
    </footer>

    <!-- SUPABASE & SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadArticleDetail() {
            const container = document.getElementById('articleDetailContainer');
            
            // Ambil parameter slug dari URL (contoh: article.html?slug=bali-real-cost-of-living)
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8">
                        <h2 class="text-base font-bold text-slate-900 mb-2">Article Not Specified</h2>
                        <p class="text-xs text-slate-500 mb-6">No article slug was provided in the link.</p>
                        <a href="./journal.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 transition">Return to Journal</a>
                    </div>
                `;
                return;
            }

            try {
                // Query ke tabel articles berdasarkan slug
                const { data: articles, error } = await supabaseClient
                    .from('articles')
                    .select('*')
                    .eq('slug', slug)
                    .single();

                if (error || !articles) {
                    container.innerHTML = `
                        <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8">
                            <h2 class="text-base font-bold text-slate-900 mb-2">Article Not Found</h2>
                            <p class="text-xs text-slate-500 mb-6">The article you are looking for might have been moved or doesn't exist.</p>
                            <a href="./journal.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 transition">Return to Journal</a>
                        </div>
                    `;
                    return;
                }

                const formattedDate = new Date(articles.created_at).toLocaleDateString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });

                let coverImg = articles.image_url;
                if (!coverImg && articles.content) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = articles.content;
                    const firstImg = tempDiv.querySelector('img');
                    if (firstImg) {
                        coverImg = firstImg.src;
                    }
                }

                // Render Halaman Detail Artikel
                document.title = `${articles.title} | SpotTribe Bali Journal`;
                
                container.innerHTML = `
                    <article class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-10 shadow-sm space-y-6">
                        <div class="space-y-3">
                            <div class="flex items-center gap-3 text-xs font-mono font-semibold text-slate-400">
                                <span>📅 ${formattedDate}</span>
                                <span>•</span>
                                <span class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full border border-emerald-200">Guide</span>
                            </div>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-tight">
                                ${escapeHtml(articles.title)}
                            </h1>
                            ${articles.description ? `<p class="text-sm sm:text-base text-slate-500 font-medium leading-relaxed">${escapeHtml(articles.description)}</p>` : ''}
                        </div>

                        ${coverImg ? `
                            <div class="w-full h-64 sm:h-96 rounded-2xl overflow-hidden bg-slate-100 border border-slate-100 shadow-inner">
                                <img src="${coverImg}" alt="${escapeHtml(articles.title)}" class="w-full h-full object-cover">
                            </div>
                        ` : ''}

                        <div class="article-content pt-4 border-t border-slate-100 text-sm text-slate-700">
                            ${articles.content || '<p class="text-slate-400 italic">No content available for this article.</p>'}
                        </div>
                    </article>
                `;

                lucide.createIcons();
            } catch (err) {
                console.error('Error fetching article detail:', err);
                container.innerHTML = '<div class="text-center py-12 text-rose-500 text-xs font-bold">An error occurred while loading the article.</div>';
            }
        }

        loadArticleDetail();

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
