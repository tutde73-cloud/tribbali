<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotTribe Bali - Community & Buddies</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="text-2xl">🌴</span>
        <span class="font-bold text-xl tracking-tight text-slate-900">SpotTribe <span class="text-sky-600">Bali</span></span>
      </a>
      <div id="authStatusArea" class="flex items-center gap-3">
        <!-- Auth status injected via JS -->
        <a href="./login.html" id="navLoginBtn" class="bg-sky-600 hover:bg-sky-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition">
          Google Login
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- HEADER TITLE -->
    <div class="text-center max-w-xl mx-auto mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Community & Social Hub</h1>
      <p class="text-slate-500 mt-2 text-sm">Discover exciting meet-ups or find casual chat buddies around Bali.</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="flex justify-center mb-8">
      <div class="bg-slate-200/70 p-1 rounded-2xl flex gap-1 w-full max-w-md">
        <button id="tabMeetupBtn" onclick="switchTab('meetup')" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition bg-white text-slate-900 shadow-sm">
          📅 Meet-ups
        </button>
        <button id="tabBuddiesBtn" onclick="switchTab('buddies')" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition text-slate-600 hover:text-slate-900">
          💬 Surf Buddies / Chat
        </button>
      </div>
    </div>

    <!-- SECTION 1: MEET-UPS TAB -->
    <section id="meetupSection" class="space-y-4">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">Upcoming Meet-ups</h2>
        <button onclick="openModal('meetupModal')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
          + Create Meet-up
        </button>
      </div>

      <!-- Dynamic Meetups List Container -->
      <div id="meetupsListContainer" class="grid md:grid-cols-2 gap-4">
        <p class="text-slate-400 text-sm italic col-span-2 text-center py-6">Loading meet-ups...</p>
      </div>
    </section>

    <!-- SECTION 2: BUDDIES / CHAT TAB (Hidden by Default) -->
    <section id="buddiesSection" class="space-y-4 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">Members Available to Chat</h2>
        <button onclick="openModal('buddyModal')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
          + Post Chat Status
        </button>
      </div>

      <!-- Dynamic Buddies List Container -->
      <div id="buddiesListContainer" class="grid md:grid-cols-3 gap-4">
        <p class="text-slate-400 text-sm italic col-span-3 text-center py-6">Loading active members...</p>
      </div>
    </section>

  </main>

  <!-- MODAL: CREATE MEET-UP -->
  <div id="meetupModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
      <h3 class="font-bold text-lg text-slate-900 mb-4">Create New Meet-up</h3>
      <form id="meetupForm" onsubmit="handleCreateMeetup(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category / Tag</label>
          <input type="text" id="meetupCategory" required placeholder="e.g. ☕ Coffee & Code" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Meet-up Title</label>
          <input type="text" id="meetupTitle" required placeholder="e.g. Coworking & Web Project Sharing" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Location / Venue</label>
          <input type="text" id="meetupLocation" required placeholder="e.g. Expat. Roasters, Canggu" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Event Time</label>
          <input type="text" id="meetupTime" required placeholder="e.g. Tomorrow, 3:00 PM" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal('meetupModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition">Publish Meet-up</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: POST CHAT STATUS -->
  <div id="buddyModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
      <h3 class="font-bold text-lg text-slate-900 mb-4">Post Your Chat Status</h3>
      <form id="buddyForm" onsubmit="handleCreateBuddy(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Location / Area in Bali</label>
          <input type="text" id="buddyLocation" required placeholder="e.g. Canggu / Denpasar" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Status Message</label>
          <textarea id="buddyStatusText" required rows="3" placeholder="e.g. Free this afternoon. Down for casual chats about web dev or coffee." class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tags (Comma separated)</label>
          <input type="text" id="buddyTags" required placeholder="e.g. Web Dev, Coffee, Nomad" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal('buddyModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition">Post Status</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SUPABASE & PAGE LOGIC -->
  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserSession = null;

    // 1. Initialize & Check User Session
    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUserSession = session;

      const authStatusArea = document.getElementById('authStatusArea');

      if (session) {
        const user = session.user;
        const avatarUrl = user.user_metadata.avatar_url || '';
        const name = user.user_metadata.full_name || user.email;

        authStatusArea.innerHTML = `
          <div class="flex items-center gap-2">
            <img src="${avatarUrl}" class="w-8 h-8 rounded-full border border-slate-300" alt="Avatar" />
            <span class="text-xs font-semibold text-slate-700 hidden sm:inline">${name}</span>
            <button onclick="handleLogout()" class="text-xs text-rose-600 hover:text-rose-700 font-medium ml-2">Logout</button>
          </div>
        `;
      }
    }

    // 2. Fetch Data from Supabase
    async function fetchMeetups() {
      const container = document.getElementById('meetupsListContainer');
      const { data, error } = await supabaseClient
        .from('meetups')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p class="text-rose-500 text-xs col-span-2 text-center">Failed to load meet-ups.</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs italic col-span-2 text-center py-6">No meet-ups available yet. Be the first to create one!</p>`;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
          <div class="flex justify-between items-start mb-3">
            <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">${escapeHtml(item.category)}</span>
            <span class="text-xs text-slate-400 font-medium">${escapeHtml(item.event_time)}</span>
          </div>
          <h3 class="font-bold text-slate-900 text-base mb-1">${escapeHtml(item.title)}</h3>
          <p class="text-slate-500 text-xs mb-4">📍 ${escapeHtml(item.location)}</p>
          <div class="flex items-center justify-between border-t border-slate-100 pt-3">
            <span class="text-xs text-slate-500">Host: <strong class="text-slate-700">${escapeHtml(item.host_name)}</strong></span>
            <button onclick="handleJoinAction('${escapeHtml(item.title)}')" class="bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">
              Join Meet-up
            </button>
          </div>
        </div>
      `).join('');
    }

    async function fetchBuddies() {
      const container = document.getElementById('buddiesListContainer');
      const { data, error } = await supabaseClient
        .from('buddies')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p class="text-rose-500 text-xs col-span-3 text-center">Failed to load active members.</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs italic col-span-3 text-center py-6">No active chat status posted yet.</p>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const initials = item.user_name ? item.user_name.substring(0, 2).toUpperCase() : 'ST';
        const tagsHtml = item.tags ? item.tags.map(t => `<span class="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded font-medium">${escapeHtml(t.trim())}</span>`).join('') : '';

        return `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex items-center gap-3 mb-3">
                ${item.avatar_url ? `<img src="${item.avatar_url}" class="w-10 h-10 rounded-full border border-slate-200" />` : `<div class="w-10 h-10 rounded-full bg-sky-100 text-sky-700 font-bold flex items-center justify-center text-sm">${initials}</div>`}
                <div>
                  <h4 class="font-bold text-slate-900 text-sm">${escapeHtml(item.user_name)}</h4>
                  <p class="text-xs text-slate-400 font-medium">${escapeHtml(item.location)}</p>
                </div>
              </div>
              <p class="text-slate-600 text-xs mb-3">"${escapeHtml(item.status_text)}"</p>
              <div class="flex flex-wrap gap-1 mb-4">
                ${tagsHtml}
              </div>
            </div>
            <button onclick="handleChatAction('${escapeHtml(item.user_name)}')" class="w-full bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold py-2 rounded-xl transition">
              💬 Start Chat
            </button>
          </div>
        `;
      }).join('');
    }

    // 3. Modal Controls
    function openModal(modalId) {
      if (!currentUserSession) {
        alert("Please sign in with Google first to perform this action.");
        window.location.href = './login.html';
        return;
      }
      document.getElementById(modalId).classList.remove('hidden');
      document.getElementById(modalId).classList.add('flex');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('flex');
      document.getElementById(modalId).classList.add('hidden');
    }

    // 4. Handle Insert Meetup
    async function handleCreateMeetup(event) {
      event.preventDefault();
      if (!currentUserSession) return;

      const user = currentUserSession.user;
      const hostName = user.user_metadata.full_name || user.email.split('@')[0];

      const newMeetup = {
        user_id: user.id,
        host_name: hostName,
        category: document.getElementById('meetupCategory').value,
        title: document.getElementById('meetupTitle').value,
        location: document.getElementById('meetupLocation').value,
        event_time: document.getElementById('meetupTime').value,
        slots_info: '1/6 Slots'
      };

      const { error } = await supabaseClient.from('meetups').insert([newMeetup]);

      if (error) {
        alert("Error creating meet-up: " + error.message);
        return;
      }

      document.getElementById('meetupForm').reset();
      closeModal('meetupModal');
      fetchMeetups();
    }

    // 5. Handle Insert Buddy Status
    async function handleCreateBuddy(event) {
      event.preventDefault();
      if (!currentUserSession) return;

      const user = currentUserSession.user;
      const userName = user.user_metadata.full_name || user.email.split('@')[0];
      const avatarUrl = user.user_metadata.avatar_url || null;
      const tagsRaw = document.getElementById('buddyTags').value;
      const tagsArray = tagsRaw.split(',').map(t => t.trim());

      const newBuddy = {
        user_id: user.id,
        user_name: userName,
        avatar_url: avatarUrl,
        location: document.getElementById('buddyLocation').value,
        status_text: document.getElementById('buddyStatusText').value,
        tags: tagsArray
      };

      const { error } = await supabaseClient.from('buddies').insert([newBuddy]);

      if (error) {
        alert("Error posting status: " + error.message);
        return;
      }

      document.getElementById('buddyForm').reset();
      closeModal('buddyModal');
      fetchBuddies();
    }

    // 6. Interaction Actions for Authenticated Users
    function handleJoinAction(meetupTitle) {
      if (!currentUserSession) {
        alert("Please sign in with Google first.");
        window.location.href = './login.html';
        return;
      }
      alert(`You have successfully requested to join: "${meetupTitle}"! The host will get in touch.`);
    }

    function handleChatAction(userName) {
      if (!currentUserSession) {
        alert("Please sign in with Google first.");
        window.location.href = './login.html';
        return;
      }
      alert(`Opening secure chat room with ${userName}... (Chat feature ready)`);
    }

    // 7. Logout Handler
    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    // 8. Tab Switcher Logic
    function switchTab(tabName) {
      const meetupBtn = document.getElementById('tabMeetupBtn');
      const buddiesBtn = document.getElementById('tabBuddiesBtn');
      const meetupSec = document.getElementById('meetupSection');
      const buddiesSec = document.getElementById('buddiesSection');

      if (tabName === 'meetup') {
        meetupSec.classList.remove('hidden');
        buddiesSec.classList.add('hidden');

        meetupBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition bg-white text-slate-900 shadow-sm";
        buddiesBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition text-slate-600 hover:text-slate-900";
      } else {
        buddiesSec.classList.remove('hidden');
        meetupSec.classList.add('hidden');

        buddiesBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition bg-white text-slate-900 shadow-sm";
        meetupBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition text-slate-600 hover:text-slate-900";
      }
    }

    // Utility XSS Escaping
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Initial Load
    initAuth();
    fetchMeetups();
    fetchBuddies();
  </script>
</body>
</html>
