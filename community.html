<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpotTribe Bali - Community Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-24">

  <!-- TOP HEADER BAR -->
  <header class="h-16 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='index.html'" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div>
        <h1 id="communityTitle" class="font-bold text-base text-slate-100 capitalize leading-tight">Tribe Community</h1>
        <p class="text-[11px] text-emerald-400 font-medium">Live Social & Networking</p>
      </div>
    </div>
  </header>

  <!-- MODAL LOGIN POPUP (Jika belum login) -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
      <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
        <i data-lucide="lock" class="w-7 h-7"></i>
      </div>
      <h2 class="text-lg font-bold text-slate-100 mb-1">Please Login to Join the Tribe</h2>
      <p class="text-xs text-slate-400 mb-6">Sign in to access community chats, meet other nomads, and RSVP to events in Bali.</p>
      <button onclick="simulateLogin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-xs font-bold transition-all shadow-lg shadow-emerald-600/20 mb-2">
        Simulate Login Now
      </button>
      <button onclick="window.location.href='index.html'" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl text-xs font-semibold transition-colors">
        Back to Map
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 p-4 max-w-xl mx-auto w-full">
    <div id="communityFeed" class="flex flex-col gap-4">
      <!-- Feed sosial akan dirender di sini -->
    </div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex items-center justify-around px-4 z-30">
    <a href="index.html" class="flex flex-col items-center gap-1 text-emerald-400">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Explore</span>
    </a>
    <a href="messages.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Chats</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
  </nav>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const commType = urlParams.get('type') || 'meetups';

    // Simulasi Cek Status Login (Default: false / belum login)
    let isLoggedIn = localStorage.getItem('spotTribeLoggedIn') === 'true';

    const communityData = {
      'meetups': [
        { title: "Canggu Nomad Sunset Gathering", location: "Echo Beach, Canggu", time: "Today, 17:30 WITA", attendees: "45 Nomads Going", image: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80", room: "canggu-sunset" },
        { title: "Ubud Startup Founders Circle", location: "Monkey Forest, Ubud", time: "Tomorrow, 10:00 WITA", attendees: "28 Founders Going", image: "https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=600&q=80", room: "ubud-startup" }
      ],
      'surfing-buddies': [
        { title: "Uluwatu Morning Surf Crew", location: "Padang Padang, Uluwatu", time: "Tomorrow, 06:00 WITA", attendees: "12 Surfers Ready", image: "https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=600&q=80", room: "uluwatu-surf" },
        { title: "Batu Bolong Sunset Longboarders", location: "Canggu, Bali", time: "Today, 16:00 WITA", attendees: "20 Surfers Ready", image: "https://images.unsplash.com/photo-1531722569936-825d3dd91b15?auto=format&fit=crop&w=600&q=80", room: "canggu-longboard" }
      ]
    };

    function initCommunity() {
      document.getElementById('communityTitle').innerText = commType === 'meetups' ? 'Community Meetups' : 'Surfing Buddies Hub';

      if (!isLoggedIn) {
        // Tampilkan modal pop-up login premium
        document.getElementById('loginModal').classList.remove('hidden');
        return;
      }

      renderFeed();
    }

    function simulateLogin() {
      localStorage.setItem('spotTribeLoggedIn', 'true');
      isLoggedIn = true;
      document.getElementById('loginModal').classList.add('hidden');
      renderFeed();
    }

    function renderFeed() {
      const feedEl = document.getElementById('communityFeed');
      const items = communityData[commType] || communityData['meetups'];

      feedEl.innerHTML = items.map(item => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col">
          <div class="h-40 relative">
            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
            <div class="absolute top-3 right-3 bg-emerald-500 text-slate-950 text-[10px] font-bold px-2.5 py-1 rounded-full shadow-md">
              ${item.attendees}
            </div>
          </div>
          <div class="p-4 flex flex-col gap-3">
            <div>
              <h3 class="font-bold text-sm text-slate-100">${escapeHtml(item.title)}</h3>
              <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400"></i> ${escapeHtml(item.location)}
              </p>
              <p class="text-xs text-emerald-400 font-mono mt-1 flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${escapeHtml(item.time)}
              </p>
            </div>
            <button onclick="openChatRoom('${item.room}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold transition-colors flex items-center justify-center gap-2 shadow-md">
              <i data-lucide="message-square" class="w-4 h-4"></i> Open Chat Room & RSVP
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function openChatRoom(roomName) {
      window.location.href = `messages.html?room=${roomName}`;
    }

    function escapeHtml(text) {
      return text.replace(/"/g, '&quot;');
    }

    initCommunity();
    lucide.createIcons();
  </script>
</body>
</html>
