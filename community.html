<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotTribe Bali - Community & Global Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="text-2xl">🌴</span>
        <span class="font-bold text-xl tracking-tight text-slate-900">SpotTribe <span class="text-sky-600">Bali</span></span>
      </a>
      <div id="authStatusArea" class="flex items-center gap-3">
        <!-- Auth status injected via JS -->
        <a href="./login.html" id="navLoginBtn" class="bg-sky-600 hover:bg-sky-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition">
          Google Login
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col">
    
    <!-- HEADER TITLE -->
    <div class="text-center max-w-xl mx-auto mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Community & Social Hub</h1>
      <p class="text-slate-500 mt-2 text-sm">Discover Bali meet-ups or chat live with fellow travelers & nomads worldwide.</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="flex justify-center mb-8">
      <div class="bg-slate-200/70 p-1 rounded-2xl flex gap-1 w-full max-w-md">
        <button id="tabMeetupBtn" onclick="switchTab('meetup')" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition bg-white text-slate-900 shadow-sm">
          📅 Meet-ups
        </button>
        <button id="tabChatBtn" onclick="switchTab('chat')" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition text-slate-600 hover:text-slate-900">
          💬 Global Live Chat
        </button>
      </div>
    </div>

    <!-- SECTION 1: MEET-UPS TAB -->
    <section id="meetupSection" class="space-y-4">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">Upcoming Meet-ups</h2>
        <button onclick="openModal('meetupModal')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
          + Create Meet-up
        </button>
      </div>

      <!-- Dynamic Meetups List Container -->
      <div id="meetupsListContainer" class="grid md:grid-cols-2 gap-4">
        <p class="text-slate-400 text-sm italic col-span-2 text-center py-6">Loading meet-ups...</p>
      </div>
    </section>

    <!-- SECTION 2: GLOBAL CHAT TAB (Hidden by Default) -->
    <section id="chatSection" class="space-y-4 hidden flex-grow flex flex-col">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-slate-800">Bali Nomad Global Chat</h2>
        <span class="text-[11px] bg-sky-100 text-sky-800 font-semibold px-2.5 py-1 rounded-full">Messages auto-clear every 3 days</span>
      </div>

      <!-- Chat Box Wrapper -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col h-[500px] overflow-hidden">
        
        <!-- Messages Scroll Area -->
        <div id="chatMessagesContainer" class="flex-grow p-4 overflow-y-auto space-y-4 bg-slate-50/50">
          <p class="text-slate-400 text-xs italic text-center py-10">Loading live conversation...</p>
        </div>

        <!-- Chat Input Form -->
        <form id="chatForm" onsubmit="handleSendMessage(event)" class="p-3 bg-white border-t border-slate-200 flex gap-2">
          <input type="text" id="chatInputMessage" required placeholder="Say something to the tribe..." class="flex-grow text-sm border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-500">
          <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition">
            Send 🚀
          </button>
        </form>
      </div>
    </section>

  </main>

  <!-- MODAL: EDIT PROFILE -->
  <div id="profileModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
      <h3 class="font-bold text-lg text-slate-900 mb-4">Edit Profile</h3>
      <form id="profileForm" onsubmit="handleSaveProfile(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
          <input type="text" id="profileFullName" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Base Location in Bali</label>
          <input type="text" id="profileLocation" required placeholder="e.g. Canggu / Denpasar / Ubud" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Bio / Short Intro</label>
          <textarea id="profileBio" rows="3" placeholder="e.g. Digital nomad, tech enthusiast, coffee & sunset lover." class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal('profileModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREATE MEET-UP -->
  <div id="meetupModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
      <h3 class="font-bold text-lg text-slate-900 mb-4">Create New Meet-up</h3>
      <form id="meetupForm" onsubmit="handleCreateMeetup(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category / Tag</label>
          <input type="text" id="meetupCategory" required placeholder="e.g. ☕ Coffee & Code" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Meet-up Title</label>
          <input type="text" id="meetupTitle" required placeholder="e.g. Coworking & Web Project Sharing" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Location / Venue</label>
          <input type="text" id="meetupLocation" required placeholder="e.g. Expat. Roasters, Canggu" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Event Time</label>
          <input type="text" id="meetupTime" required placeholder="e.g. Tomorrow, 3:00 PM" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal('meetupModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition">Publish Meet-up</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SUPABASE & PAGE LOGIC -->
  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserSession = null;
    let currentUserProfile = null;

    // 1. Initialize & Check User Session
    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUserSession = session;

      const authStatusArea = document.getElementById('authStatusArea');

      if (session) {
        const user = session.user;
        await loadUserProfile(user);

        const avatarUrl = currentUserProfile?.avatar_url || user.user_metadata.avatar_url || '';
        const name = currentUserProfile?.full_name || user.user_metadata.full_name || user.email;

        authStatusArea.innerHTML = `
          <div class="flex items-center gap-2">
            <img src="${avatarUrl}" class="w-8 h-8 rounded-full border border-slate-300" alt="Avatar" />
            <button onclick="openProfileModal()" class="text-xs font-semibold text-slate-700 hover:text-sky-600 transition hidden sm:inline">
              ${escapeHtml(name)} (Edit Profile)
            </button>
            <button onclick="handleLogout()" class="text-xs text-rose-600 hover:text-rose-700 font-medium ml-2">Logout</button>
          </div>
        `;
      }
    }

    // 2. Load Profile Data from Supabase
    async function loadUserProfile(user) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .maybeSingle();

      if (data) {
        currentUserProfile = data;
      } else {
        const defaultName = user.user_metadata.full_name || user.email.split('@')[0];
        const defaultAvatar = user.user_metadata.avatar_url || null;
        
        const { data: created } = await supabaseClient
          .from('profiles')
          .upsert([{ id: user.id, full_name: defaultName, avatar_url: defaultAvatar, location: 'Bali' }])
          .select()
          .single();

        currentUserProfile = created;
      }
    }

    function openProfileModal() {
      if (!currentUserProfile) return;
      document.getElementById('profileFullName').value = currentUserProfile.full_name || '';
      document.getElementById('profileLocation').value = currentUserProfile.location || 'Bali';
      document.getElementById('profileBio').value = currentUserProfile.bio || '';
      openModal('profileModal');
    }

    async function handleSaveProfile(event) {
      event.preventDefault();
      if (!currentUserSession) return;

      const updatedData = {
        full_name: document.getElementById('profileFullName').value,
        location: document.getElementById('profileLocation').value,
        bio: document.getElementById('profileBio').value,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from('profiles')
        .update(updatedData)
        .eq('id', currentUserSession.user.id);

      if (error) {
        alert("Error saving profile: " + error.message);
        return;
      }

      alert("Profile updated successfully!");
      closeModal('profileModal');
      initAuth();
    }

    // 3. Fetch Data from Supabase (Meetups)
    async function fetchMeetups() {
      const container = document.getElementById('meetupsListContainer');
      const { data, error } = await supabaseClient
        .from('meetups')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p class="text-rose-500 text-xs col-span-2 text-center">Failed to load meet-ups.</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs italic col-span-2 text-center py-6">No meet-ups available yet. Be the first to create one!</p>`;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
          <div class="flex justify-between items-start mb-3">
            <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">${escapeHtml(item.category)}</span>
            <span class="text-xs text-slate-400 font-medium">${escapeHtml(item.event_time)}</span>
          </div>
          <h3 class="font-bold text-slate-900 text-base mb-1">${escapeHtml(item.title)}</h3>
          <p class="text-slate-500 text-xs mb-4">📍 ${escapeHtml(item.location)}</p>
          <div class="flex items-center justify-between border-t border-slate-100 pt-3">
            <span class="text-xs text-slate-500">Host: <strong class="text-slate-700">${escapeHtml(item.host_name)}</strong></span>
            <button onclick="handleJoinAction('${escapeHtml(item.title)}')" class="bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">
              Join Meet-up
            </button>
          </div>
        </div>
      `).join('');
    }

    // 4. Global Chat Logic & Realtime Subscription
    async function fetchMessages() {
      const container = document.getElementById('chatMessagesContainer');
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        container.innerHTML = `<p class="text-rose-500 text-xs text-center">Failed to load messages.</p>`;
        return;
      }

      renderMessages(data);
    }

    function renderMessages(messages) {
      const container = document.getElementById('chatMessagesContainer');
      if (!messages || messages.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs italic text-center py-10">No messages yet. Be the first to say hello to the tribe!</p>`;
        return;
      }

      container.innerHTML = messages.map(msg => {
        const isMe = currentUserSession && currentUserSession.user.id === msg.sender_id;
        const initials = msg.sender_name ? msg.sender_name.substring(0, 2).toUpperCase() : 'ST';
        const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="flex items-start gap-3 ${isMe ? 'flex-row-reverse' : ''}">
            ${msg.sender_avatar ? `<img src="${msg.sender_avatar}" class="w-8 h-8 rounded-full border border-slate-200 flex-shrink-0" />` : `<div class="w-8 h-8 rounded-full bg-sky-100 text-sky-700 font-bold flex items-center justify-center text-xs flex-shrink-0">${initials}</div>`}
            <div class="max-w-[75%]">
              <div class="flex items-center gap-2 mb-1 ${isMe ? 'justify-end' : ''}">
                <span class="text-xs font-bold text-slate-700">${escapeHtml(msg.sender_name)}</span>
                <span class="text-[10px] text-slate-400">${timeStr}</span>
              </div>
              <div class="p-3 rounded-2xl text-xs leading-relaxed ${isMe ? 'bg-sky-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm'}">
                ${escapeHtml(msg.message_text)}
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    async function handleSendMessage(event) {
      event.preventDefault();
      if (!currentUserSession) {
        alert("Please sign in with Google first to send messages.");
        window.location.href = './login.html';
        return;
      }

      const input = document.getElementById('chatInputMessage');
      const text = input.value.trim();
      if (!text) return;

      const senderName = currentUserProfile?.full_name || currentUserSession.user.user_metadata.full_name || 'Member';
      const senderAvatar = currentUserProfile?.avatar_url || currentUserSession.user.user_metadata.avatar_url || null;

      const { error } = await supabaseClient.from('messages').insert([{
        sender_id: currentUserSession.user.id,
        sender_name: senderName,
        sender_avatar: senderAvatar,
        message_text: text
      }]);

      if (error) {
        alert("Error sending message: " + error.message);
        return;
      }

      input.value = '';
    }

    // Setup Supabase Realtime Listener
    function setupRealtimeChat() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          // Fetch all or append new message smoothly
          fetchMessages();
        })
        .subscribe();
    }

    // 5. Modal Controls
    function openModal(modalId) {
      if (!currentUserSession && modalId !== 'profileModal') {
        alert("Please sign in with Google first to perform this action.");
        window.location.href = './login.html';
        return;
      }
      document.getElementById(modalId).classList.remove('hidden');
      document.getElementById(modalId).classList.add('flex');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('flex');
      document.getElementById(modalId).classList.add('hidden');
    }

    // 6. Handle Insert Meetup
    async function handleCreateMeetup(event) {
      event.preventDefault();
      if (!currentUserSession) return;

      const hostName = currentUserProfile?.full_name || currentUserSession.user.user_metadata.full_name || 'Member';

      const newMeetup = {
        user_id: currentUserSession.user.id,
        host_name: hostName,
        category: document.getElementById('meetupCategory').value,
        title: document.getElementById('meetupTitle').value,
        location: document.getElementById('meetupLocation').value,
        event_time: document.getElementById('meetupTime').value,
        slots_info: '1/6 Slots'
      };

      const { error } = await supabaseClient.from('meetups').insert([newMeetup]);

      if (error) {
        alert("Error creating meet-up: " + error.message);
        return;
      }

      document.getElementById('meetupForm').reset();
      closeModal('meetupModal');
      fetchMeetups();
    }

    function handleJoinAction(meetupTitle) {
      if (!currentUserSession) {
        alert("Please sign in with Google first.");
        window.location.href = './login.html';
        return;
      }
      alert(`You have successfully requested to join: "${meetupTitle}"! The host will get in touch.`);
    }

    // 7. Logout Handler
    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    // 8. Tab Switcher Logic
    function switchTab(tabName) {
      const meetupBtn = document.getElementById('tabMeetupBtn');
      const chatBtn = document.getElementById('tabChatBtn');
      const meetupSec = document.getElementById('meetupSection');
      const chatSec = document.getElementById('chatSection');

      if (tabName === 'meetup') {
        meetupSec.classList.remove('hidden');
        chatSec.classList.add('hidden');

        meetupBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition bg-white text-slate-900 shadow-sm";
        chatBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition text-slate-600 hover:text-slate-900";
      } else {
        chatSec.classList.remove('hidden');
        meetupSec.classList.add('hidden');

        chatBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition bg-white text-slate-900 shadow-sm";
        meetupBtn.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition text-slate-600 hover:text-slate-900";
        
        // Scroll to bottom of chat when switched
        const container = document.getElementById('chatMessagesContainer');
        container.scrollTop = container.scrollHeight;
      }
    }

    // Utility XSS Escaping
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Initial Load
    initAuth();
    fetchMeetups();
    fetchMessages();
    setupRealtimeChat();
  </script>
</body>
</html>
