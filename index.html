  <!-- Application Logic & Leaflet Integration -->
  <script>
    // 1. Initialize Leaflet Map (Centered in Bali)
    const map = L.map('map', { zoomControl: false }).setView([-8.5500, 115.1800], 10);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 2. Official Free OpenStreetMap Tile Layer (No API Key Required)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    let activeMarkers = [];

    // 3. Fetch Default Spots (Cafes) in Real-Time from Bali Overpass API
    async function fetchDefaultSpots() {
      const baliBBox = "-8.9,114.4,-8.0,115.7";
      const overpassQuery = `[out:json][timeout:25];(node["amenity"="cafe"](${baliBBox}););out body;`;
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        const spots = [];

        if (data.elements) {
          data.elements.forEach(el => {
            if (el.lat && el.lon) {
              spots.push({
                name: el.tags && el.tags.name ? el.tags.name : "Bali Cafe (OSM)",
                lat: el.lat,
                lng: el.lon,
                address: el.tags && el.tags["addr:suburb"] ? el.tags["addr:suburb"] : "Bali"
              });
            }
          });
        }
        renderSpotsToMap(spots.slice(0, 30));
      } catch (e) {
        console.warn("Failed to load initial map data:", e);
      }
    }

    // Render Markers onto the Map
    function renderSpotsToMap(spots) {
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];

      spots.forEach(spot => {
        const popupContent = `
          <div class="p-2.5 max-w-xs text-slate-900">
            <h3 class="font-bold text-sm text-slate-900 mb-1">${spot.name}</h3>
            <p class="text-xs text-slate-500 mb-3">📍 ${spot.address}</p>
            <button onclick="joinChat('${escapeHtml(spot.name)}')" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl transition-colors shadow-sm flex items-center justify-center gap-1.5">
              💬 Join Chat
            </button>
          </div>
        `;
        const marker = L.marker([spot.lat, spot.lng]).addTo(map);
        marker.bindPopup(popupContent);
        activeMarkers.push(marker);
      });
    }

    // 4. Multi-Page Navigation Logic
    function goToCategory(type) {
      window.location.href = `category.html?type=${type}`;
    }

    function joinChat(spotName) {
      const formattedRoomName = encodeURIComponent(spotName.toLowerCase().replace(/\s+/g, '-'));
      window.location.href = `messages.html?room=${formattedRoomName}`;
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
          window.location.href = `category.html?search=${encodeURIComponent(query)}`;
        }
      }
    }

    function escapeHtml(text) {
      return text.replace(/"/g, '&quot;');
    }

    // Initialize execution
    fetchDefaultSpots();
    lucide.createIcons();
  </script>
