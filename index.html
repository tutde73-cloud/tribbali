    html, body { height: 100vh; margin: 0; overflow: hidden; background-color: #050811; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Layout Dimensions */
    .app-header { height: 72px; width: 100%; }
    .map-bento-hero { height: 46vh; width: 100%; position: relative; z-index: 10; }
    .bento-scroll-container { height: calc(54vh - 72px - 68px); width: 100%; overflow-y: auto; scroll-behavior: smooth; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glassmorphism & Depth Effects */
    .glass-nav { background: rgba(5, 8, 17, 0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .glass-floating { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15); }
    .glass-chip { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px); }

    /* Micro-Animations & Stagger Entrance */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-entrance { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.08); }
    }
    .pulse-live { animation: pulseGlow 2.2s infinite ease-in-out; }

    /* Bento Card Hover Dynamics */
    .bento-card {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bento-card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 20px 35px -10px rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
    }
  </style>

  <!-- SUPABASE & LEAFLET MAP SCRIPT -->
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-8.5500, 115.1800], 10);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allPlaces = [];
    let markersLayer = L.layerGroup().addTo(map);

    async function loadAllMapMarkers() {
      try {
        const { data: places, error } = await clientSupabase
          .from('places')
          .select('name, area, category, latitude, longitude, price_label, rating, image_url');

        if (error) throw error;

        allPlaces = places || [];
        document.getElementById('mapCount').innerText = allPlaces.length;
        renderMarkers(allPlaces);
      } catch (err) {
        console.error('Failed to load map markers:', err);
      }
    }

    function renderMarkers(placesToRender) {
      markersLayer.clearLayers();

      placesToRender.forEach(spot => {
        if (spot.latitude && spot.longitude) {
          const marker = L.marker([spot.latitude, spot.longitude]);
          
          const popupContent = `
            <div style="font-family: system-ui, sans-serif; font-size: 12px; width: 175px; padding: 2px;">
              <img src="${spot.image_url || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=300&q=80'}" style="width:100%; height:95px; object-fit:cover; border-radius:12px; margin-bottom:6px;" />
              <strong style="font-size: 13px; color: #0f172a; display:block; line-height:1.2; font-weight:800; margin-bottom:2px;">${spot.name}</strong>
              <span style="color: #64748b; display:block; margin-bottom:6px; font-size:11px;">📍 ${spot.area || 'Bali'}</span>
              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; padding-top: 6px;">
                <span style="color: #059669; font-weight: 800; font-size: 11px;">★ ${spot.rating || '4.5'}</span>
                <span style="color: #0f172a; font-weight: 800; font-size: 11px;">${spot.price_label || 'Inquiry'}</span>
              </div>
            </div>
          `;
          marker.bindPopup(popupContent);
          markersLayer.addLayer(marker);
        }
      });
    }

    function filterMapCategory(cat) {
      const chips = ['all', 'villas', 'cafe', 'coliving', 'coworking', 'beach', 'waterfall'];
      chips.forEach(c => {
        const btn = document.getElementById(`chip-${c}`);
        if (btn) {
          if (c === cat) {
            btn.className = "px-4 py-1.5 rounded-full text-[11px] font-bold bg-emerald-600 text-white shadow-lg shadow-emerald-950/40 shrink-0 transition-all duration-300 border border-emerald-500 scale-105";
          } else {
            btn.className = "px-4 py-1.5 rounded-full text-[11px] font-semibold glass-chip text-slate-800 shadow-md shrink-0 hover:bg-white transition-all duration-300 border border-slate-200/80 hover:scale-105";
          }
        }
      });

      if (cat === 'all') {
        renderMarkers(allPlaces);
      } else {
        const filtered = allPlaces.filter(p => p.category === cat);
        renderMarkers(filtered);
      }
    }

    loadAllMapMarkers();

    function goToCategory(type) {
      if (type === 'meetups' || type === 'surfing-buddies') {
        window.location.href = `community.html?type=${type}`;
      } else {
        window.location.href = `category.html?type=${type}`;
      }
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
          window.location.href = `category.html?q=${encodeURIComponent(query)}`;
        }
      }
    }

    lucide.createIcons();
  </script>
