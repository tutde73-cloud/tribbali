  <!-- MAP & SUPABASE CORE SCRIPT -->
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-8.5500, 115.1800], 10);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allPlaces = [];
    let markersLayer = L.layerGroup().addTo(map);

    async function loadAllMapMarkers() {
      try {
        const { data: places, error } = await clientSupabase
          .from('places')
          .select('name, area, category, latitude, longitude, price_label, rating, image_url');

        if (error) throw error;

        allPlaces = places || [];
        document.getElementById('mapCount').innerText = allPlaces.length;
        renderMarkers(allPlaces);
      } catch (err) {
        console.error('Failed to load map markers:', err);
      }
    }

    function renderMarkers(placesToRender) {
      markersLayer.clearLayers();

      placesToRender.forEach(spot => {
        if (spot.latitude && spot.longitude) {
          const marker = L.marker([spot.latitude, spot.longitude]);
          
          const popupContent = `
            <div style="font-family: system-ui, sans-serif; font-size: 12px; width: 170px; padding: 2px;">
              <img src="${spot.image_url || 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=300&q=80'}" style="width:100%; height:95px; object-fit:cover; border-radius:10px; margin-bottom:6px;" />
              <strong style="font-size: 13px; color: #0f172a; display:block; line-height:1.2; font-weight:700; margin-bottom:2px;">${spot.name}</strong>
              <span style="color: #64748b; display:block; margin-bottom:6px; font-size:11px;">📍 ${spot.area || 'Bali'}</span>
              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; padding-top: 6px;">
                <span style="color: #059669; font-weight: 700; font-size: 11px;">★ ${spot.rating || '4.5'}</span>
                <span style="color: #0f172a; font-weight: 700; font-size: 11px;">${spot.price_label || 'Inquiry'}</span>
              </div>
            </div>
          `;
          marker.bindPopup(popupContent);
          markersLayer.addLayer(marker);
        }
      });
    }

    function filterMapCategory(cat) {
      const chips = ['all', 'villas', 'cafe', 'coliving', 'coworking', 'beach', 'waterfall'];
      chips.forEach(c => {
        const btn = document.getElementById(`chip-${c}`);
        if (btn) {
          if (c === cat) {
            btn.className = "px-3.5 py-1.5 rounded-full text-[11px] font-bold bg-emerald-600 text-white shadow-lg shadow-emerald-900/20 shrink-0 transition-all border border-emerald-500";
          } else {
            btn.className = "px-3.5 py-1.5 rounded-full text-[11px] font-semibold glass-chip text-slate-800 shadow-md shrink-0 hover:bg-white transition-all border border-slate-200";
          }
        }
      });

      if (cat === 'all') {
        renderMarkers(allPlaces);
      } else {
        const filtered = allPlaces.filter(p => p.category === cat);
        renderMarkers(filtered);
      }
    }

    loadAllMapMarkers();

    function goToCategory(type) {
      if (type === 'meetups' || type === 'surfing-buddies') {
        window.location.href = `community.html?type=${type}`;
      } else {
        window.location.href = `category.html?type=${type}`;
      }
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
          window.location.href = `category.html?q=${encodeURIComponent(query)}`;
        }
      }
    }

    lucide.createIcons();
  </script>
