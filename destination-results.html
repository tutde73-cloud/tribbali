<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Destination Stays & Experiences — SpotTribe Bali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding-bottom: 40px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .aff-widget-slot { width: 100%; min-height: 60px; overflow-x: auto; overflow-y: hidden; }
    .aff-widget-slot iframe, .aff-widget-slot ins { max-width: 100% !important; width: 100% !important; }
    .exp-btn.filter-active,
    .dest-btn.filter-active {
      background-color: #059669 !important;
      color: #ffffff !important;
      border-color: #059669 !important;
    }
  </style>
</head>
<body class="text-slate-800">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 h-16 flex items-center justify-between sticky top-0 z-40 shadow-md">
    <a href="./index.html" class="inline-flex items-center gap-2 text-xs font-extrabold text-white hover:text-emerald-400 transition">
      <i data-lucide="arrow-left" class="w-4 h-4 text-emerald-400"></i>
      <span>Back to Explore</span>
    </a>
    <span class="text-xs font-mono font-bold text-emerald-400 uppercase tracking-wider">SpotTribe Bali</span>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 space-y-6">

    <!-- SEARCH & FILTER -->
    <section class="bg-white border border-slate-200 rounded-3xl p-4 sm:p-5 shadow-sm space-y-4">
      <form onsubmit="submitSearchForm(event)" class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-2xl px-3 py-1.5">
        <i data-lucide="search" class="w-4 h-4 text-emerald-600 shrink-0"></i>
        <input id="pageSearchInput" type="text" placeholder="Search area, villa, hotel, or activity (e.g. Ubud, Kuta, Gianyar)..."
               class="w-full bg-transparent text-sm text-slate-900 placeholder-slate-400 focus:outline-none py-1.5" />
        <button type="submit" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold hover:bg-emerald-700 transition shrink-0 cursor-pointer">
          Search
        </button>
      </form>

      <!-- Quick Area Chips -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
        <button type="button" onclick="setDest('')" data-dest-btn="" class="dest-btn px-3.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">All Areas</button>
        <button type="button" onclick="setDest('Ubud')" data-dest-btn="Ubud" class="dest-btn px-3.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Ubud</button>
        <button type="button" onclick="setDest('Kuta')" data-dest-btn="Kuta" class="dest-btn px-3.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Kuta</button>
        <button type="button" onclick="setDest('Gianyar')" data-dest-btn="Gianyar" class="dest-btn px-3.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Gianyar</button>
        <button type="button" onclick="setDest('Seminyak')" data-dest-btn="Seminyak" class="dest-btn px-3.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Seminyak</button>
        <button type="button" onclick="setDest('Canggu')" data-dest-btn="Canggu" class="dest-btn px-3.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Canggu</button>
      </div>

      <!-- Category & Activity Type Filter -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1 border-t border-slate-100">
        <span class="text-[11px] font-bold text-slate-400 shrink-0 mr-1">Filter:</span>
        <button type="button" onclick="setExpFilter('all')" data-exp-btn="all" class="exp-btn filter-active px-3 py-1 rounded-full text-[11px] font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">All</button>
        <button type="button" onclick="setExpFilter('stays')" data-exp-btn="stays" class="exp-btn px-3 py-1 rounded-full text-[11px] font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Villas & Hotels</button>
        <button type="button" onclick="setExpFilter('outdoor')" data-exp-btn="outdoor" class="exp-btn px-3 py-1 rounded-full text-[11px] font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Outdoor</button>
        <button type="button" onclick="setExpFilter('tour')" data-exp-btn="tour" class="exp-btn px-3 py-1 rounded-full text-[11px] font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Tours</button>
        <button type="button" onclick="setExpFilter('water')" data-exp-btn="water" class="exp-btn px-3 py-1 rounded-full text-[11px] font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Water</button>
        <button type="button" onclick="setExpFilter('spa')" data-exp-btn="spa" class="exp-btn px-3 py-1 rounded-full text-[11px] font-bold border border-slate-200 bg-slate-50 text-slate-700 shrink-0 cursor-pointer">Spa & Wellness</button>
      </div>
    </section>

    <!-- RESULT HEADING -->
    <div class="flex flex-wrap items-center justify-between gap-3 px-1">
      <div>
        <h1 id="resultHeading" class="text-lg sm:text-xl font-black text-slate-900">Stays & Experiences</h1>
        <p id="resultSubheading" class="text-xs text-slate-500">Loading from places & activities_widgets...</p>
      </div>
      <a href="#activitiesSection" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-700 hover:border-emerald-500 hover:text-emerald-700 transition shadow-sm">
        <span>Activities</span>
        <span>↓</span>
      </a>
    </div>

    <!-- SECTION 1: HOTELS & VILLAS -->
    <section id="staysSection" class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-black uppercase tracking-widest text-slate-600 flex items-center gap-2">
          <i data-lucide="bed" class="w-4 h-4 text-emerald-600"></i> Hotels & Villas
        </h2>
        <span id="staysCountBadge" class="text-[11px] font-mono font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="staysList" class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-5 text-center text-xs text-slate-400">Loading stays...</div>
      </div>
    </section>

    <!-- SECTION 2: ACTIVITIES & EXPERIENCES -->
    <section id="activitiesSection" class="space-y-3 pt-2 scroll-mt-20">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-black uppercase tracking-widest text-slate-600 flex items-center gap-2">
          <i data-lucide="compass" class="w-4 h-4 text-teal-600"></i> Activities & Experiences
        </h2>
        <span id="activitiesCountBadge" class="text-[11px] font-mono font-bold text-teal-700 bg-teal-50 border border-teal-200 px-2.5 py-0.5 rounded-full">0</span>
      </div>
      <div id="activitiesList" class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-5 text-center text-xs text-slate-400">Loading activities...</div>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://riyupzmllltjrelqytwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_df32CqJ5bqDNCHU4OKGRPQ_7LiJvWV0';
    const PLACES_TABLE = 'places';
    const ACTIVITIES_TABLE = 'activities_widgets';

    const clientSupabase = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const urlParams = new URLSearchParams(window.location.search);
    let currentKeyword = (urlParams.get('q') || urlParams.get('dest') || 'Ubud').trim();
    let currentExpFilter = (urlParams.get('exp') || 'all').toLowerCase();
    let allPlaces = [];
    let allActivities = [];
    let placesErrorMsg = '';
    let activitiesErrorMsg = '';
    let klookTimer = null;

    document.getElementById('pageSearchInput').value = currentKeyword;

    function createSlug(text) {
      return String(text || '').toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text || '').replace(/[&<>"']/g, m => map[m]);
    }

    function stripHtml(htmlStr) {
      const tmp = document.createElement('div');
      tmp.innerHTML = String(htmlStr || '');
      return (tmp.textContent || tmp.innerText || '').trim();
    }

    function getWidgetHtml(item) {
      return String(item.widget_code || item.widget_html || item.affiliate_widget || '').trim();
    }

    function executeEmbeddedScripts() {
      document.querySelectorAll('.aff-widget-slot').forEach(slot => {
        const scripts = Array.from(slot.querySelectorAll('script'));
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });
          if (oldScript.textContent) {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      });
    }

    function reloadKlookWidgets() {
      clearTimeout(klookTimer);
      klookTimer = setTimeout(() => {
        executeEmbeddedScripts();
        const existing = document.getElementById('klook-widget-loader');
        if (existing) existing.remove();

        const s = document.createElement('script');
        s.id = 'klook-widget-loader';
        s.src = 'https://affiliate.klook.com/widget/fetch-iframe-init.js?t=' + Date.now();
        s.async = true;
        document.body.appendChild(s);
      }, 150);
    }

    function syncUrlParams() {
      const params = new URLSearchParams();
      if (currentKeyword) params.set('q', currentKeyword);
      if (currentExpFilter && currentExpFilter !== 'all') params.set('exp', currentExpFilter);
      window.history.replaceState({}, '', `?${params.toString()}`);
    }

    function setDest(dest) {
      currentKeyword = dest;
      document.getElementById('pageSearchInput').value = dest;
      syncUrlParams();
      renderFilteredResults();
    }

    function setExpFilter(expType) {
      currentExpFilter = expType;
      syncUrlParams();
      renderFilteredResults();
      if (expType !== 'all' && expType !== 'stays') {
        const actEl = document.getElementById('activitiesSection');
        if (actEl) actEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function submitSearchForm(e) {
      e.preventDefault();
      currentKeyword = document.getElementById('pageSearchInput').value.trim();
      syncUrlParams();
      renderFilteredResults();
    }

    function isStayItem(item) {
      const cat = String(item.category || item.type || '').toLowerCase();
      return cat.includes('villa') || cat.includes('hotel') || cat.includes('resort') || cat.includes('stay');
    }

    function matchesKeyword(item, kw) {
      if (!kw) return true;
      const q = kw.toLowerCase();
      const plainDesc = stripHtml(item.description || '');
      const hay = `${item.name || ''} ${item.title || ''} ${item.area || ''} ${item.location || ''} ${item.category || ''} ${plainDesc}`.toLowerCase();
      return hay.includes(q);
    }

    function matchesActivityCategory(item, expType) {
      if (!expType || expType === 'all' || expType === 'stays') return true;
      const cat = String(item.category || '').toLowerCase().trim();
      if (expType === 'outdoor') return cat.includes('outdoor');
      if (expType === 'tour') return cat.includes('tour');
      if (expType === 'water') return cat.includes('water');
      if (expType === 'spa') return cat.includes('spa') || cat.includes('wellness') || cat.includes('massage');
      return cat.includes(expType);
    }

    function renderCard(item, tagLabel, detailBase = './spot-detail.html', isActivity = false) {
      const rawTitle = item.name || item.title || (isActivity ? 'Activity' : 'Stay');
      const name = escapeHtml(rawTitle);
      const area = escapeHtml(item.area || item.location || 'Bali');
      const rating = item.rating ? ` • ★ ${escapeHtml(item.rating)}` : '';
      const cleanDesc = escapeHtml(stripHtml(item.description || ''));
      const slug = item.slug || createSlug(rawTitle);
      const url = `${detailBase}?slug=${slug}`;
      const widgetHtml = getWidgetHtml(item);

      return `
        <article class="bg-white border border-slate-200 rounded-3xl p-4 sm:p-5 shadow-sm space-y-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <span class="inline-block text-[10px] font-mono font-bold uppercase ${isActivity ? 'text-teal-700 bg-teal-50 border-teal-200' : 'text-emerald-700 bg-emerald-50 border-emerald-200'} border px-2 py-0.5 rounded-md mb-1">
                ${tagLabel}
              </span>
              <h3 class="text-base font-extrabold text-slate-900 leading-snug">
                <a href="${url}" class="hover:text-emerald-600 transition">${name}</a>
              </h3>
              <p class="text-xs text-slate-500 mt-0.5">📍 ${area}${rating}</p>
            </div>
            <a href="${url}" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-emerald-600 transition shrink-0">
              Detail →
            </a>
          </div>

          ${cleanDesc ? `<p class="text-xs text-slate-600 leading-relaxed line-clamp-2">${cleanDesc}</p>` : ''}

          ${widgetHtml ? `<div class="aff-widget-slot pt-2 border-t border-slate-100">${widgetHtml}</div>` : ''}
        </article>
      `;
    }

    function renderFilteredResults() {
      document.querySelectorAll('.dest-btn').forEach(btn => {
        const active = btn.getAttribute('data-dest-btn').toLowerCase() === currentKeyword.toLowerCase();
        btn.classList.toggle('filter-active', active);
      });

      document.querySelectorAll('.exp-btn').forEach(btn => {
        const active = btn.getAttribute('data-exp-btn') === currentExpFilter;
        btn.classList.toggle('filter-active', active);
      });

      const showOnlyStays = currentExpFilter === 'stays';
      const showOnlyActivities = ['outdoor', 'tour', 'water', 'spa'].includes(currentExpFilter);

      const stays = showOnlyActivities
        ? []
        : allPlaces.filter(p => matchesKeyword(p, currentKeyword) && isStayItem(p));

      const activeRows = allActivities.filter(item =>
        item.is_active === undefined || item.is_active === null || Boolean(item.is_active) === true
      );
      activeRows.sort((a, b) => (a.sort_id ?? a.id ?? 0) - (b.sort_id ?? b.id ?? 0));

      const catActivities = activeRows.filter(a => matchesActivityCategory(a, currentExpFilter));
      const areaCatActivities = catActivities.filter(a => matchesKeyword(a, currentKeyword));

      let activities = [];
      let isFallbackArea = false;

      if (!showOnlyStays) {
        if (currentExpFilter === 'all') {
          activities = activeRows.filter(a => matchesKeyword(a, currentKeyword));
        } else if (areaCatActivities.length > 0) {
          activities = areaCatActivities;
        } else {
          activities = catActivities;
          isFallbackArea = true;
        }
      }

      document.getElementById('staysSection').classList.toggle('hidden', showOnlyActivities);
      document.getElementById('activitiesSection').classList.toggle('hidden', showOnlyStays);

      document.getElementById('resultHeading').textContent = currentKeyword ? `Results for "${currentKeyword}"` : 'All Stays & Experiences';
      document.getElementById('resultSubheading').textContent = isFallbackArea
        ? `${stays.length} hotels & villas • ${activities.length} ${currentExpFilter} activities (from ${ACTIVITIES_TABLE})`
        : `${stays.length} hotels & villas • ${activities.length} activities`;
      document.getElementById('staysCountBadge').textContent = stays.length;
      document.getElementById('activitiesCountBadge').textContent = activities.length;

      const staysEl = document.getElementById('staysList');
      const actEl = document.getElementById('activitiesList');

      if (!showOnlyActivities) {
        if (placesErrorMsg) {
          staysEl.innerHTML = `<div class="bg-white border border-rose-200 rounded-2xl p-5 text-center text-xs text-rose-600">Stays error: ${escapeHtml(placesErrorMsg)}</div>`;
        } else {
          staysEl.innerHTML = stays.length > 0
            ? stays.map(s => renderCard(s, escapeHtml(s.category || 'Stay'), './spot-detail.html', false)).join('')
            : `<div class="bg-white border border-slate-200 rounded-2xl p-5 text-center text-xs text-slate-500">No hotels or villas matched your filter.</div>`;
        }
      }

      if (!showOnlyStays) {
        if (activitiesErrorMsg) {
          actEl.innerHTML = `<div class="bg-white border border-rose-200 rounded-2xl p-5 text-center text-xs text-rose-600">Activities error: ${escapeHtml(activitiesErrorMsg)}</div>`;
        } else {
          actEl.innerHTML = activities.length > 0
            ? activities.map(a => renderCard(a, escapeHtml(a.category || 'Activity'), './activity-detail.html', true)).join('')
            : `<div class="bg-white border border-slate-200 rounded-2xl p-5 text-center text-xs text-slate-500">No activities matched your filter in ${ACTIVITIES_TABLE}.</div>`;
        }
      }

      lucide.createIcons();
      reloadKlookWidgets();
    }

    async function loadAllData() {
      if (!clientSupabase) {
        placesErrorMsg = 'Supabase client failed to initialize.';
        activitiesErrorMsg = 'Supabase client failed to initialize.';
        renderFilteredResults();
        return;
      }

      try {
        const { data, error } = await clientSupabase.from(PLACES_TABLE).select('*');
        if (error) throw error;
        allPlaces = data || [];
        placesErrorMsg = '';
      } catch (err) {
        console.error('Error loading places:', err);
        placesErrorMsg = err?.message || 'Failed to load places';
      }

      try {
        const { data, error } = await clientSupabase.from(ACTIVITIES_TABLE).select('*');
        if (error) throw error;
        allActivities = data || [];
        activitiesErrorMsg = '';
      } catch (err) {
        console.error('Error loading activities_widgets:', err);
        activitiesErrorMsg = err?.message || 'Failed to load activities_widgets';
      }

      renderFilteredResults();
    }

    lucide.createIcons();
    loadAllData();
  </script>
</body>
</html>
